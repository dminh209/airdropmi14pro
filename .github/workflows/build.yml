          print("ALL SOURCE PATCHES APPLIED CLEANLY AND SAFELY!")

      - name: Compile AWDL Kernel Modules (including qca_cld3_kiwi_v2.ko)
        run: |
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KERNEL_SRC="$GITHUB_WORKSPACE/ack-6.1"
          export KBUILD_MODPOST_WARN=1
          export WERROR=0
          export LOCALVERSION="-android14-11-g0c3d559bcd85-ab14529422"

          mkdir -p "$GITHUB_WORKSPACE/output"

          # 1. Compile wonder.ko
          if [ -d "$GITHUB_WORKSPACE/wlan/wonder" ]; then
            cd "$GITHUB_WORKSPACE/wlan/wonder"
            echo 'KCFLAGS += -I$(src)/include -I$(src)' > Makefile.include
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$PWD/include -I$PWD" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f wonder.ko ] && cp wonder.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 2. Compile wonder provider & probe
          if [ -d "$GITHUB_WORKSPACE/wlan/provider" ]; then
            cd "$GITHUB_WORKSPACE/wlan/provider"
            echo "obj-m += opairshare_wonder_provider.o" > Kbuild
            echo "opairshare_wonder_provider-y := provider.o" >> Kbuild
            echo "obj-m += opairshare_route_b_probe.o" >> Kbuild
            echo "opairshare_route_b_probe-y := probe.o" >> Kbuild
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$GITHUB_WORKSPACE/wlan/wonder/include -I$GITHUB_WORKSPACE/wlan/wonder" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f opairshare_wonder_provider.ko ] && cp opairshare_wonder_provider.ko "$GITHUB_WORKSPACE/output/"
            [ -f opairshare_route_b_probe.ko ] && cp opairshare_route_b_probe.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 3. Compile patched qca_cld3_kiwi_v2.ko (PASSTHRU / AWDL enabled)
          if [ -d "$GITHUB_WORKSPACE/wlan/qcacld-3.0" ]; then
            cd "$GITHUB_WORKSPACE/wlan/qcacld-3.0"
            ln -sfn "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" cmn

            # Directory symlinks for fw-api to satisfy api/fw/wmi.h includes
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/soc"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" soc

            set -o pipefail
            make -j$(nproc) -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 \
              MODNAME=qca_cld3_kiwi_v2 \
              CONFIG_QCA_CLD_WLAN=m \
              CONFIG_QCA_CLD_WLAN_PROFILE=pineapple_gki_kiwi-v2 \
              CONFIG_QCA_WIFI_ISOC=0 \
              CONFIG_QCA_WIFI_2_0=1 \
              WLAN_ROOT="$PWD" \
              WLAN_COMMON_ROOT=cmn \
              WLAN_COMMON_INC="$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" \
              WLAN_FW_API="$GITHUB_WORKSPACE/wlan/fw-api" \
              WLAN_PLATFORM_INC="$GITHUB_WORKSPACE/wlan/platform/inc" \
              DATA_IPA_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include" \
              DATA_IPA_UAPI_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KCFLAGS="-w -DDRIVER_PASSTHRU_MODE -DCONFIG_IPA3=1 -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              EXTRA_CFLAGS="-w -DDRIVER_PASSTHRU_MODE -DCONFIG_IPA3=1 -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/qca_build.log || {
                echo "=== FIRST COMPILE ERRORS ==="
                grep -m 25 -B 1 -A 2 "fatal error:\|error:" /tmp/qca_build.log || tail -n 50 /tmp/qca_build.log
                exit 1
              }
            [ -f qca_cld3_kiwi_v2.ko ] || { echo "ERROR: qca_cld3_kiwi_v2.ko was not built!"; exit 1; }
            cp qca_cld3_kiwi_v2.ko "$GITHUB_WORKSPACE/output/"
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Patch Module Layout & CRC (Xiaomi 14 Pro Shennong Spec)
        shell: python
        working-directory: ${{ github.workspace }}/output
        run: |
          import glob, os, struct
          from elftools.elf.elffile import ELFFile

          INIT_TARGET = 0x170
          EXIT_TARGET = 0x3d8
          LAYOUT_CRC = 0xea759d7f

          def fix_module(path):
              if not os.path.exists(path):
                  return
              print(f"Patching {path}...")
              data = bytearray(open(path, 'rb').read())
              
              with open(path, 'rb') as f:
                  elf = ELFFile(f)
                  rs = elf.get_section_by_name('.rela.gnu.linkonce.this_module')
                  st = elf.get_section_by_name('.symtab')
                  if rs and st:
                      off, entsize = rs['sh_offset'], rs['sh_entsize']
                      for n, r in enumerate(rs.iter_relocations()):
                          sname = st.get_symbol(r['r_info_sym']).name
                          cur = r['r_offset']
                          if sname == 'init_module' and cur != INIT_TARGET:
                              struct.pack_into('<Q', data, off + n * entsize, INIT_TARGET)
                              print(f"  Patched init_module: {hex(cur)} -> {hex(INIT_TARGET)}")
                          elif sname == 'cleanup_module' and cur != EXIT_TARGET:
                              struct.pack_into('<Q', data, off + n * entsize, EXIT_TARGET)
                              print(f"  Patched cleanup_module: {hex(cur)} -> {hex(EXIT_TARGET)}")

                  sec = elf.get_section_by_name('__versions')
                  if sec:
                      base, size = sec['sh_offset'], sec['sh_size']
                      for o in range(base, base + size, 64):
                          name = bytes(data[o+8:o+64]).split(b'\0', 1)[0].decode('latin1', errors='ignore')
                          if name == 'module_layout':
                              old = struct.unpack_from('<Q', data, o)[0] & 0xffffffff
                              if old != LAYOUT_CRC:
                                  struct.pack_into('<Q', data, o, LAYOUT_CRC)
                                  print(f"  Patched module_layout CRC: {hex(old)} -> {hex(LAYOUT_CRC)}")

              open(path, 'wb').write(data)
              print(f"Successfully finalized {path}")

          for f in glob.glob('*.ko'):
              fix_module(f)

      - name: Package Final Drivers
        run: |
          cd "$GITHUB_WORKSPACE/output"
          zip -9 airdrop-drivers-sm8650-safe.zip *.ko
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-drivers-sm8650-safe
          path: ${{ github.workspace }}/output/airdrop-drivers-sm8650-safe.zip
