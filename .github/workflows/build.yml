name: Build Xiaomi 14 Pro AirDrop Driver (SM8650 - KCFI Safe)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Xiaomi 14 Pro AirDrop Driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zip unzip curl git python3 python3-pip python-is-python3
          pip3 install --break-system-packages pyelftools pyyaml

      - name: Setup Official Google Clang (Android NDK r26d Toolchain)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip
          NDK_DIR=$(find "$GITHUB_WORKSPACE/toolchain" -maxdepth 1 -name "android-ndk-*" -type d | head -n 1)
          LLVM_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "PATH=$LLVM_BIN:$PATH" >> $GITHUB_ENV
          echo "TOOLCHAIN_PATH=$LLVM_BIN" >> $GITHUB_ENV
          echo "CLANG_PATH=$LLVM_BIN/clang" >> $GITHUB_ENV
          echo "LLVM_PATH=$LLVM_BIN" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Verify Clang Version
        run: |
          clang --version

      - name: Download ACK Kernel 6.1 (Commit 0c3d559bcd85)
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -f -sSL --retry 3 -o ack-6.1.tar.gz "https://android.googlesource.com/kernel/common/+archive/0c3d559bcd85c64dae9c9c9687abbe5347fff3ad.tar.gz"
          mkdir -p ack-6.1
          tar -xzf ack-6.1.tar.gz -C ack-6.1
          rm -f ack-6.1.tar.gz

      - name: Download wlan-patched Source from Release
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o wlan-patched.zip "https://github.com/dminh209/airdropmi14pro/releases/download/v1.0/wlan-patched.zip" || \
          curl -sSL -o wlan-patched.zip "https://github.com/dminh209/airdropmi14pro/releases/download/v1.0/wlan-patched.zip"
          mkdir -p wlan
          unzip -q -o wlan-patched.zip -d wlan
          rm -f wlan-patched.zip

      - name: Setup Vendor & Qualcomm IPA Headers
        shell: python
        run: |
          import os, urllib.request, base64

          os.makedirs('ack-6.1/include/linux', exist_ok=True)
          os.makedirs('ack-6.1/include/uapi/linux', exist_ok=True)
          os.makedirs('ack-6.1/include/soc/qcom', exist_ok=True)
          os.makedirs('ack-6.1/include/soc/oplus/system', exist_ok=True)
          os.makedirs('dataipa/drivers/platform/msm/include/uapi/linux', exist_ok=True)
          os.makedirs('dataipa/drivers/platform/msm/include/linux', exist_ok=True)

          # 1. qcom-iommu-util.h
          with open('ack-6.1/include/linux/qcom-iommu-util.h', 'w') as f:
              f.write('''#ifndef _LINUX_QCOM_IOMMU_UTIL_H
          #define _LINUX_QCOM_IOMMU_UTIL_H
          #include <linux/types.h>
          #include <linux/iommu.h>
          #define QCOM_IOMMU_MAPPING_CONF_S1_BYPASS 1
          #define QCOM_IOMMU_MAPPING_CONF_ATOMIC 2
          #define QCOM_IOMMU_MAPPING_CONF_FAST 4
          static inline int qcom_iommu_get_mappings_configuration(struct iommu_domain *domain) { return 0; }
          #endif
          ''')

          # 2. boot_stats.h
          with open('ack-6.1/include/soc/qcom/boot_stats.h', 'w') as f:
              f.write('''#ifndef _SOC_QCOM_BOOT_STATS_H
          #define _SOC_QCOM_BOOT_STATS_H
          static inline void place_marker(const char *name) {}
          #endif
          ''')

          # 3. oplus_project.h
          with open('ack-6.1/include/soc/oplus/system/oplus_project.h', 'w') as f:
              f.write('''#ifndef _SOC_OPLUS_SYSTEM_OPLUS_PROJECT_H_
          #define _SOC_OPLUS_SYSTEM_OPLUS_PROJECT_H_
          #include <linux/types.h>
          enum { RELEASE = 0, DEBUG, AGING, USER };
          static inline int get_eng_version(void) { return 0; }
          static inline int get_project(void) { return 0; }
          static inline bool is_project(int project) { return false; }
          #endif
          ''')

          # 4. boot_mode.h
          with open('ack-6.1/include/soc/oplus/system/boot_mode.h', 'w') as f:
              f.write('''#ifndef _SOC_OPLUS_SYSTEM_BOOT_MODE_H_
          #define _SOC_OPLUS_SYSTEM_BOOT_MODE_H_
          #define MSM_BOOT_MODE__NORMAL 0
          #define MSM_BOOT_MODE__WLAN 1
          static inline int get_boot_mode(void) { return 0; }
          #endif
          ''')

          # 5. msm_gsi.h & msm-sps.h
          with open('ack-6.1/include/linux/msm_gsi.h', 'w') as f:
              f.write('''#ifndef _LINUX_MSM_GSI_H
          #define _LINUX_MSM_GSI_H
          enum gsi_prefetch_mode { GSI_USE_PREFETCH, GSI_ESCAPE_PREFETCH_OPT };
          #endif
          ''')

          with open('ack-6.1/include/linux/msm-sps.h', 'w') as f:
              f.write('''#ifndef _LINUX_MSM_SPS_H
          #define _LINUX_MSM_SPS_H
          #include <linux/types.h>
          struct sps_mem_buffer { u32 base; u32 size; phys_addr_t phys_base; };
          struct sps_iovec { u32 addr; u32 size; u32 flags; };
          #endif
          ''')

          # 6. Fetch Official Qualcomm IPA headers from Google AOSP Kernel repo with Fallbacks
          branch = 'android-msm-coral-4.14-android12'
          base_gs = f'https://android.googlesource.com/kernel/msm/+/refs/heads/{branch}'

          extra_ipa_stubs = '''
          #ifndef _LINUX_EXTRA_IPA_STUBS_H
          #define _LINUX_EXTRA_IPA_STUBS_H

          /* Additional IPA definitions for modern Qualcomm kernels */
          struct ipa_wdi_bw_info {
              uint32_t threshold[3];
              bool stop;
          };

          struct ipa_wdi_capabilities_out_params {
              uint8_t num_of_instances;
          };

          struct ipa_wdi_init_in_params_inst {
              uint8_t inst_id;
          };

          struct ipa_wdi_init_out_params_inst {
              uint8_t hdl;
          };

          struct ipa_wdi_tx_info {
              uint64_t sta_tx;
              uint64_t ap_tx;
          };

          struct ipa_inform_wlan_bw {
              uint32_t index;
              uint32_t throughput;
          };

          struct ipa_ast_info_type {
              uint8_t data[64];
          };

          static inline int ipa_uc_bw_monitor(struct ipa_wdi_bw_info *bw_info) { return 0; }
          static inline int ipa_wdi_sw_stats(struct ipa_wdi_tx_info *tx_stats) { return 0; }
          static inline int ipa_wdi_get_capabilities(struct ipa_wdi_capabilities_out_params *out) {
              if (out) out->num_of_instances = 1;
              return 1;
          }

          #endif /* _LINUX_EXTRA_IPA_STUBS_H */
          '''

          extra_wdi3_stubs = '''
          #ifndef _LINUX_EXTRA_IPA_WDI3_STUBS_H
          #define _LINUX_EXTRA_IPA_WDI3_STUBS_H

          #include <linux/types.h>

          typedef void *ipa_wdi_hdl_t;
          typedef int (*ipa_wdi_opt_dpath_flt_rsrv_cb)(uint32_t num_filters, void *flt_info);
          typedef int (*ipa_wdi_opt_dpath_flt_rsrv_rel_cb)(uint32_t num_filters, void *flt_info);

          struct ipa_wdi_opt_dpath_flt_reg_params {
              ipa_wdi_hdl_t hdl;
              ipa_wdi_opt_dpath_flt_rsrv_cb flt_rsrv_cb;
              ipa_wdi_opt_dpath_flt_rsrv_rel_cb flt_rsrv_rel_cb;
          };

          static inline int ipa_wdi_opt_dpath_flt_reg(struct ipa_wdi_opt_dpath_flt_reg_params *params) {
              return 0;
          }

          static inline int ipa_wdi_opt_dpath_flt_dereg(ipa_wdi_hdl_t hdl) {
              return 0;
          }

          #endif /* _LINUX_EXTRA_IPA_WDI3_STUBS_H */
          '''

          files_to_stage = {
              'include/linux/ipa.h': [
                  'ack-6.1/include/linux/ipa.h',
                  'dataipa/drivers/platform/msm/include/linux/ipa.h'
              ],
              'include/linux/ipa_wdi3.h': [
                  'ack-6.1/include/linux/ipa_wdi3.h',
                  'dataipa/drivers/platform/msm/include/linux/ipa_wdi3.h'
              ],
              'include/uapi/linux/msm_ipa.h': [
                  'ack-6.1/include/linux/msm_ipa.h',
                  'ack-6.1/include/uapi/linux/msm_ipa.h',
                  'dataipa/drivers/platform/msm/include/uapi/linux/msm_ipa.h',
                  'dataipa/drivers/platform/msm/include/linux/msm_ipa.h'
              ],
              'include/linux/ipa_uc_offload.h': [
                  'dataipa/drivers/platform/msm/include/ipa_uc_offload.h',
                  'ack-6.1/include/linux/ipa_uc_offload.h'
              ]
          }

          for remote_path, local_targets in files_to_stage.items():
              url = f"{base_gs}/{remote_path}?format=TEXT"
              fetched = False
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'curl/7.88.1'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      content = base64.b64decode(resp.read()).decode('utf-8', errors='ignore')
                      if remote_path == 'include/linux/ipa.h':
                          content += '\n' + extra_ipa_stubs
                      elif remote_path == 'include/linux/ipa_wdi3.h':
                          idx = content.rfind('#endif')
                          if idx != -1:
                              content = content[:idx] + '\n' + extra_wdi3_stubs + '\n' + content[idx:]
                          else:
                              content += '\n' + extra_wdi3_stubs
                      for t in local_targets:
                          with open(t, 'w') as out_f:
                              out_f.write(content)
                      print(f"Fetched {remote_path} successfully")
                      fetched = True
              except Exception as e:
                  print(f"Warning fetching {remote_path}: {e}")

              if not fetched:
                  if 'ipa_wdi3' in remote_path:
                      fallback_hdr = '''#ifndef _IPA_WDI3_H_
          #define _IPA_WDI3_H_
          #include <linux/ipa.h>
          ''' + extra_wdi3_stubs + '''
          #endif
          '''
                  else:
                      fallback_hdr = '''#ifndef _LINUX_IPA_FALLBACK_H
          #define _LINUX_IPA_FALLBACK_H
          #include <linux/types.h>
          #include <linux/device.h>
          enum ipa_hw_type { IPA_HW_None = 0, IPA_HW_v1_0 = 1, IPA_HW_v3_0 = 7, IPA_HW_MAX = 30 };
          enum ipa_client_type { IPA_CLIENT_MAX = 100 };
          static inline enum ipa_hw_type ipa_get_hw_type(void) { return IPA_HW_None; }
          static inline bool ipa_is_ready(void) { return false; }
          #endif
          ''' + extra_ipa_stubs
                  for t in local_targets:
                      with open(t, 'w') as out_f:
                          out_f.write(fallback_hdr)
                  print(f"Wrote fallback for {remote_path}")

          print("Qualcomm IPA and vendor headers setup complete!")

      - name: Prepare Kernel Headers
        run: |
          cd "$GITHUB_WORKSPACE/ack-6.1"
          make ARCH=arm64 LLVM=1 gki_defconfig
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_CFG80211
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_DEBUG_INFO_BTF_MODULES
          scripts/config --set-str CONFIG_LOCALVERSION "-android14-11-g0c3d559bcd85-ab14529422"
          make ARCH=arm64 LLVM=1 olddefconfig
          sed -i 's/next_path = strchr(s,/next_path = (char *)strchr(s,/g' tools/lib/bpf/libbpf.c 2>/dev/null || true
          sed -i 's/s = strchr(s,/s = (char *)strchr(s,/g' tools/lib/bpf/libbpf.c 2>/dev/null || true
          sed -i 's/-Werror//g' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
          sed -i 's/-Werror//g' tools/lib/bpf/Makefile 2>/dev/null || true
          sed -i 's/-Werror//g' tools/build/Makefile.build 2>/dev/null || true
          make ARCH=arm64 LLVM=1 WERROR=0 HOSTCFLAGS="-w" modules_prepare

      - name: Apply Source Patches (AWDL & Passthru Compatibility)
        shell: python
        working-directory: ${{ github.workspace }}/wlan/qcacld-3.0
        run: |
          import os, re

          # 1. Generate wlan_hdd_wondertap.h
          wt_h_content = """#ifndef _WLAN_HDD_WONDERTAP_H_
          #define _WLAN_HDD_WONDERTAP_H_

          #include <linux/types.h>
          #include <linux/device.h>
          #include <wonder/wondertap.h>
          #include <cdp_txrx_cmn_struct.h>
          #include <wlan_dp_ucfg_api.h>
          #include <sme_api.h>
          #include <wlan_cm_roam_public_struct.h>

          typedef enum wondertap_rate_bw qdf_wondertap_rate_bw_t;
          typedef enum wondertap_rate_preamble qdf_wondertap_rate_preamble_t;
          typedef struct wondertap_set_freq_params qdf_wondertap_set_freq_params_t;
          typedef struct wondertap_fixed_tx_rate_params qdf_wondertap_tx_rate_params_t;
          typedef struct wondertap_init_params qdf_wondertap_init_params_t;
          typedef struct wondertap_deinit_params qdf_wondertap_deinit_params_t;
          typedef enum wondertap_filter_type qdf_wondertap_filter_type_t;
          typedef struct wondertap_frame_filter_params qdf_wondertap_frame_filter_params_t;
          typedef struct wondertap_bssid_filter_params qdf_wondertap_bssid_filter_params_t;
          typedef struct wondertap_tx_rate_params qdf_wondertap_fixed_rate_params_t;

          struct hdd_adapter;

          #if defined(WLAN_FEATURE_11BE_MLO) && defined(CFG80211_11BE_BASIC)
          int hdd_wondertap_register_link(struct hdd_adapter *adapter, uint8_t link_id);
          int hdd_wondertap_unregister_link(struct hdd_adapter *adapter, uint8_t link_id);
          #endif

          int hdd_wondertap_adapter_init(struct hdd_adapter *adapter);
          void hdd_wondertap_adapter_deinit(struct hdd_adapter *adapter);
          int hdd_wondertap_init(void);
          void hdd_wondertap_deinit(void);

          #endif /* _WLAN_HDD_WONDERTAP_H_ */
          """
          with open('core/hdd/inc/wlan_hdd_wondertap.h', 'w') as f:
              f.write(wt_h_content)

          # 2. Patch core/hdd/inc/wlan_hdd_main.h
          with open('core/hdd/inc/wlan_hdd_main.h', 'r+') as f:
              c = f.read()
              if 'chan_change_notify_work' not in c:
                  c = c.replace('struct freq_change_info ch_chng_info;', 'struct freq_change_info ch_chng_info;\n\tqdf_work_t chan_change_notify_work;')
              if 'struct hdd_mon_set_ch_info ch_info;' not in c:
                  c = c.replace('\tuint8_t user_cfg_chn_width;\n};', '\tuint8_t user_cfg_chn_width;\n\tstruct hdd_mon_set_ch_info ch_info;\n};')
              if 'qdf_freq_t mon_chan_freq;' not in c:
                  c = c.replace('bool monitor_mode_vdev_up_in_progress;', 'bool monitor_mode_vdev_up_in_progress;\n\tqdf_freq_t mon_chan_freq;\n\tuint32_t mon_bandwidth;')
              if 'struct work_struct sap_stop_bss_work;' not in c:
                  c = c.replace('struct work_struct scan_block_work;', 'struct work_struct scan_block_work;\n\tstruct work_struct sap_stop_bss_work;')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 3. Patch core/hdd/src/wlan_hdd_main.c
          with open('core/hdd/src/wlan_hdd_main.c', 'r+') as f:
              c = f.read()
              # static declaration conflicts
              c = c.replace('static bool\nhdd_is_chan_switch_in_progress(void)', 'bool\nhdd_is_chan_switch_in_progress(void)')
              c = c.replace('static bool hdd_is_chan_switch_in_progress(void)', 'bool hdd_is_chan_switch_in_progress(void)')
              c = c.replace('static void\nhdd_adapter_update_links_on_link_switch', 'void\nhdd_adapter_update_links_on_link_switch')
              c = c.replace('static void hdd_adapter_update_links_on_link_switch', 'void hdd_adapter_update_links_on_link_switch')
              c = c.replace('static void\nhdd_vdev_configure_rtt_params', 'void\nhdd_vdev_configure_rtt_params')
              c = c.replace('static void hdd_vdev_configure_rtt_params', 'void hdd_vdev_configure_rtt_params')
              # policy_mgr_is_sta_sap_scc call: add 3rd boolean argument
              c = c.replace('policy_mgr_is_sta_sap_scc(adapter->hdd_ctx->psoc, ap_chan_freq)', 'policy_mgr_is_sta_sap_scc(adapter->hdd_ctx->psoc, ap_chan_freq, false)')
              c = c.replace('policy_mgr_is_sta_sap_scc(adapter->hdd_ctx->psoc,\n\t\t\t\t\t       ap_chan_freq)', 'policy_mgr_is_sta_sap_scc(adapter->hdd_ctx->psoc, ap_chan_freq, false)')
              # redefinition of rtnl lock helpers
              c = c.replace('static inline bool hdd_hold_rtnl_lock(void)', 'static inline bool _hdd_dup_hold_rtnl_lock(void)')
              c = c.replace('static inline void hdd_release_rtnl_lock(void)', 'static inline void _hdd_dup_release_rtnl_lock(void)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 4. Patch core/hdd/src/wlan_hdd_cfg80211.c
          with open('core/hdd/src/wlan_hdd_cfg80211.c', 'r+') as f:
              c = f.read()
              c = c.replace('static int\nos_if_monitor_mode_configure', 'int\nos_if_monitor_mode_configure')
              c = c.replace('static int os_if_monitor_mode_configure', 'int os_if_monitor_mode_configure')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 5. Patch core/hdd/src/wlan_hdd_stats.c
          with open('core/hdd/src/wlan_hdd_stats.c', 'r+') as f:
              c = f.read()
              c = c.replace('static inline bool wlan_hdd_is_mlo_connection(', 'bool wlan_hdd_is_mlo_connection(')
              c = c.replace('static inline bool wlan_hdd_is_link_switch_in_progress(', 'bool wlan_hdd_is_link_switch_in_progress(')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 6. Patch core/mac/src/pe/lim/lim_session.c
          with open('core/mac/src/pe/lim/lim_session.c', 'r+') as f:
              c = f.read()
              c = c.replace('static inline void pe_delete_fils_info(', 'void pe_delete_fils_info(')
              c = c.replace('static inline void pe_init_fils_info(', 'void pe_init_fils_info(')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 7. Patch core/mac/src/pe/include/lim_ft.h
          with open('core/mac/src/pe/include/lim_ft.h', 'r+') as f:
              c = f.read()
              c = c.replace('struct mac_context *mac\n\t\t\t', 'struct mac_context *mac,\n\t\t\t')
              c = c.replace('struct mac_context *mac\n', 'struct mac_context *mac,\n')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 8. Patch core/sap/src/sap_ch_select.c
          with open('core/sap/src/sap_ch_select.c', 'r+') as f:
              c = f.read()
              c = c.replace('policy_mgr_is_sta_sap_scc(p_sap_ctx->psoc, passthru_chan)', 'policy_mgr_is_sta_sap_scc(p_sap_ctx->psoc, passthru_chan, false)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 9. Patch core/sap/src/sap_module.c (policy_mgr_get_valid_chans_from_range 5 args)
          with open('core/sap/src/sap_module.c', 'r+') as f:
              c = f.read()
              c = c.replace('policy_mgr_get_valid_chans_from_range(sap_ctx->psoc,\n\t\t\t\t\t\t   channel_list,\n\t\t\t\t\t\t   &num_channels,\n\t\t\t\t\t\t   true)',
                            'policy_mgr_get_valid_chans_from_range(sap_ctx->psoc,\n\t\t\t\t\t\t   channel_list,\n\t\t\t\t\t\t   &num_channels,\n\t\t\t\t\t\t   true,\n\t\t\t\t\t\t   sap_ctx->vdev_id)')
              c = c.replace('policy_mgr_get_valid_chans_from_range(sap_ctx->psoc, channel_list, &num_channels, true)',
                            'policy_mgr_get_valid_chans_from_range(sap_ctx->psoc, channel_list, &num_channels, true, sap_ctx->vdev_id)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 10. Patch core/wma/inc/wma.h & core/wma/inc/wma_internal.h
          with open('core/wma/inc/wma.h', 'r+') as f:
              c = f.read()
              c = c.replace('QDF_STATUS wma_create_peer(tp_wma_handle wma_handle,\n\t\t\t   struct qdf_mac_addr peer_addr,\n\t\t\t   uint32_t peer_type,\n\t\t\t   uint8_t vdev_id, bool is_bcast,\n\t\t\t   bool is_wep, void *peer_ctx);',
                            'QDF_STATUS wma_create_peer(tp_wma_handle wma_handle,\n\t\t\t   struct qdf_mac_addr peer_addr,\n\t\t\t   tpAddStaParams sta_param,\n\t\t\t   uint32_t peer_type,\n\t\t\t   uint8_t vdev_id, bool is_bcast,\n\t\t\t   bool is_wep, void *peer_ctx);')
              c = c.replace('void wma_fill_hold_req(tp_wma_handle wma, uint8_t vdev_id,\n\t\t       uint32_t msg_type, void *msg,\n\t\t       uint32_t peer_status, uint8_t req_type);',
                            'void wma_fill_hold_req(tp_wma_handle wma, uint8_t vdev_id,\n\t\t       uint32_t msg_type, void *msg,\n\t\t       uint8_t *mac_addr,\n\t\t       uint32_t peer_status, uint8_t req_type);')
              f.seek(0)
              f.write(c)
              f.truncate()

          with open('core/wma/inc/wma_internal.h', 'r+') as f:
              c = f.read()
              c = c.replace('void *wma_find_remove_req_msgtype(tp_wma_handle wma, uint8_t vdev_id,\n\t\t\t\t   uint32_t msg_type, bool remove);',
