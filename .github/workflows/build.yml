name: Build Xiaomi 14 Pro AirDrop Driver (SM8650 - KCFI Safe)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev libncurses5-dev zip curl python3 rsync gcc-aarch64-linux-gnu python3-pip
          pip3 install pyelftools

      - name: Setup Official Google Clang (Android NDK r26d Toolchain)
        run: |
          NDK_CLANG=$(find /usr/local/lib/android/sdk/ndk -name clang 2>/dev/null | grep 'bin/clang$' | sort -V | tail -n 1 || true)
          if [ -n "$NDK_CLANG" ]; then
            CLANG_DIR=$(dirname "$NDK_CLANG")
            echo "$CLANG_DIR" >> $GITHUB_PATH
          else
            curl -sSL "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip" -o ndk.zip
            unzip -q ndk.zip "android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/*"
            rm ndk.zip
            echo "$PWD/android-ndk-r26d/toolchains/llvm/prebuilt/linux-x86_64/bin" >> $GITHUB_PATH
          fi

      - name: Verify Clang Version
        run: clang --version

      - name: Download ACK Kernel 6.1 (Commit 0c3d559bcd85)
        run: |
          git clone --depth 1 --branch android14-6.1 https://android.googlesource.com/kernel/common ack-6.1
          cd ack-6.1
          git fetch --depth 1 origin 0c3d559bcd85 || true
          git checkout 0c3d559bcd85 2>/dev/null || true

      - name: Download wlan-patched source from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0 -p "wlan-patched.zip"
          mkdir -p wlan
          unzip -q wlan-patched.zip -d wlan

      - name: Fetch Qualcomm IPA Headers
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/linux"
          mkdir -p "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux"
          mkdir -p "$GITHUB_WORKSPACE/ack-6.1/include/linux"
          mkdir -p "$GITHUB_WORKSPACE/ack-6.1/include/uapi/linux"

          BASE_URL="https://raw.githubusercontent.com/OnePlusOSS/android_kernel_modules_and_devicetree_oneplus_sm8650/oneplus/sm8650_v_15.0.0_oneplus12/vendor/qcom/opensource/dataipa/drivers/platform/msm/include"
          for h in ipa.h ipa_eth.h ipa_mhi.h ipa_odu_bridge.h ipa_qdss.h ipa_uc_offload.h ipa_wdi3.h ipa_wigig.h msm_gsi.h; do
            curl -sSL "$BASE_URL/linux/$h" -o "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/linux/$h" || true
            cp "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/linux/$h" "$GITHUB_WORKSPACE/ack-6.1/include/linux/" 2>/dev/null || true
          done
          for u in ipa_qmi_service_v01.h msm_ipa.h rmnet_ipa_fd_ioctl.h; do
            curl -sSL "$BASE_URL/uapi/linux/$u" -o "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux/$u" || true
            cp "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux/$u" "$GITHUB_WORKSPACE/ack-6.1/include/uapi/linux/" 2>/dev/null || true
          done

      - name: Prepare Kernel Headers
        run: |
          cd ack-6.1
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LOCALVERSION="-android14-11-g0c3d559bcd85-ab14529422"
          make gki_defconfig
          make -j$(nproc) modules_prepare

      - name: Compile AWDL Kernel Modules (including qca_cld3_kiwi_v2.ko)
        run: |
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KERNEL_SRC="$GITHUB_WORKSPACE/ack-6.1"
          export KBUILD_MODPOST_WARN=1
          export WERROR=0
          export LOCALVERSION="-android14-11-g0c3d559bcd85-ab14529422"

          mkdir -p "$GITHUB_WORKSPACE/output"

          # 1. Compile wonder.ko
          if [ -d "$GITHUB_WORKSPACE/wlan/wonder" ]; then
            cd "$GITHUB_WORKSPACE/wlan/wonder"
            echo 'KCFLAGS += -I$(src)/include -I$(src)' > Makefile.include
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$PWD/include -I$PWD" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f wonder.ko ] && cp wonder.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 2. Compile wonder provider & probe
          if [ -d "$GITHUB_WORKSPACE/wlan/provider" ]; then
            cd "$GITHUB_WORKSPACE/wlan/provider"
            echo "obj-m += opairshare_wonder_provider.o" > Kbuild
            echo "opairshare_wonder_provider-y := provider.o" >> Kbuild
            echo "obj-m += opairshare_route_b_probe.o" >> Kbuild
            echo "opairshare_route_b_probe-y := probe.o" >> Kbuild
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$GITHUB_WORKSPACE/wlan/wonder/include -I$GITHUB_WORKSPACE/wlan/wonder" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f opairshare_wonder_provider.ko ] && cp opairshare_wonder_provider.ko "$GITHUB_WORKSPACE/output/"
            [ -f opairshare_route_b_probe.ko ] && cp opairshare_route_b_probe.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 3. Compile patched qca_cld3_kiwi_v2.ko (PASSTHRU / AWDL enabled)
          if [ -d "$GITHUB_WORKSPACE/wlan/qcacld-3.0" ]; then
            cd "$GITHUB_WORKSPACE/wlan/qcacld-3.0"
            ln -sfn "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" cmn
            # Ensure wlan_hdd_wondertap.o is linked and wma_opairshare_pas_mgmt.h is included
            if ! grep -q "wlan_hdd_wondertap.o" Kbuild; then
              sed -i 's|\$(HDD_SRC_DIR)/wlan_hdd_tx_rx.o \\|\$(HDD_SRC_DIR)/wlan_hdd_tx_rx.o \\\n\t\t\$(HDD_SRC_DIR)/wlan_hdd_wondertap.o \\|' Kbuild
            fi
            if ! grep -q "wma_opairshare_pas_mgmt.h" core/wma/src/wma_data.c; then
              echo '#include "wma_opairshare_pas_mgmt.h"' >> core/wma/src/wma_data.c
            fi
            make -j$(nproc) -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 \
              MODNAME=qca_cld3_kiwi_v2 \
              CONFIG_QCA_CLD_WLAN=m \
              CONFIG_QCA_CLD_WLAN_PROFILE=pineapple_gki_kiwi-v2 \
              CONFIG_QCA_WIFI_ISOC=0 \
              CONFIG_QCA_WIFI_2_0=1 \
              WLAN_ROOT="$PWD" \
              WLAN_COMMON_ROOT=cmn \
              WLAN_COMMON_INC="$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" \
              WLAN_FW_API="$GITHUB_WORKSPACE/wlan/fw-api" \
              WLAN_PLATFORM_INC="$GITHUB_WORKSPACE/wlan/platform/inc" \
              DATA_IPA_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include" \
              DATA_IPA_UAPI_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KCFLAGS="-w -DDRIVER_PASSTHRU_MODE -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f qca_cld3_kiwi_v2.ko ] && cp qca_cld3_kiwi_v2.ko "$GITHUB_WORKSPACE/output/"
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Patch Module Layout & CRC (Xiaomi 14 Pro Shennong Spec)
        run: |
          cat << 'EOF' > patch_shennong.py
          import struct, sys, os
          from elftools.elf.elffile import ELFFile

          INIT_TARGET = 0x170
          EXIT_TARGET = 0x3d8
          LAYOUT_CRC = 0xea759d7f

          def fix_module(path):
              if not os.path.exists(path): return
              print(f"Patching {path}...")
              data = bytearray(open(path, 'rb').read())

              with open(path, 'rb') as f:
                  elf = ELFFile(f)
                  rs = elf.get_section_by_name('.rela.gnu.linkonce.this_module')
                  st = elf.get_section_by_name('.symtab')
                  if rs and st:
                      off, entsize = rs['sh_offset'], rs['sh_entsize']
                      for n, r in enumerate(rs.iter_relocations()):
                          sname = st.get_symbol(r['r_info_sym']).name
                          cur = r['r_offset']
                          if sname == 'init_module' and cur != INIT_TARGET:
                              struct.pack_into('<Q', data, off + n * entsize, INIT_TARGET)
                              print(f"  Patched init_module: {hex(cur)} -> {hex(INIT_TARGET)}")
                          elif sname == 'cleanup_module' and cur != EXIT_TARGET:
                              struct.pack_into('<Q', data, off + n * entsize, EXIT_TARGET)
                              print(f"  Patched cleanup_module: {hex(cur)} -> {hex(EXIT_TARGET)}")

                  sec = elf.get_section_by_name('__versions')
                  if sec:
                      base, size = sec['sh_offset'], sec['sh_size']
                      for o in range(base, base + size, 64):
                          name = bytes(data[o+8:o+64]).split(b'\0', 1)[0].decode('latin1', errors='ignore')
                          if name == 'module_layout':
                              old = struct.unpack_from('<Q', data, o)[0] & 0xffffffff
                              struct.pack_into('<Q', data, o, LAYOUT_CRC)
                              print(f"  Patched module_layout CRC: {hex(old)} -> {hex(LAYOUT_CRC)}")

              open(path, 'wb').write(data)
              print(f"Successfully finalized {path}")

          for f in sys.argv[1:]:
              fix_module(f)
          EOF

          python3 patch_shennong.py "$GITHUB_WORKSPACE/output/"*.ko

      - name: Package Final Drivers
        run: |
          cd "$GITHUB_WORKSPACE/output"
          zip -9 airdrop-drivers-sm8650-safe.zip *.ko
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-drivers-sm8650-safe
          path: ${{ github.workspace }}/output/airdrop-drivers-sm8650-safe.zip
