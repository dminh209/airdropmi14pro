name: Build Xiaomi 14 Pro AirDrop Driver (SM8650 - KCFI Safe)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Xiaomi 14 Pro AirDrop Driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev zlib1g-dev dwarves pkg-config zip unzip curl git python3 python3-pip python-is-python3
          pip3 install --break-system-packages pyelftools pyyaml

      - name: Setup Official Google Clang (Android NDK r26d Toolchain)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          curl -sSL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r26d-linux.zip"
          unzip -q ndk.zip
          rm -f ndk.zip
          NDK_DIR=$(find "$GITHUB_WORKSPACE/toolchain" -maxdepth 1 -name "android-ndk-*" -type d | head -n 1)
          LLVM_BIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$LLVM_BIN" >> $GITHUB_PATH
          echo "PATH=$LLVM_BIN:$PATH" >> $GITHUB_ENV
          echo "TOOLCHAIN_PATH=$LLVM_BIN" >> $GITHUB_ENV
          echo "CLANG_PATH=$LLVM_BIN/clang" >> $GITHUB_ENV
          echo "LLVM_PATH=$LLVM_BIN" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Verify Clang Version
        run: |
          clang --version

      - name: Download ACK Kernel 6.1 (Commit 0c3d559bcd85)
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -f -sSL --retry 3 -o ack-6.1.tar.gz "https://android.googlesource.com/kernel/common/+archive/0c3d559bcd85c64dae9c9c9687abbe5347fff3ad.tar.gz"
          mkdir -p ack-6.1
          tar -xzf ack-6.1.tar.gz -C ack-6.1
          rm -f ack-6.1.tar.gz

      - name: Download wlan-patched Source from Release
        run: |
          cd "$GITHUB_WORKSPACE"
          curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o wlan-patched.zip "https://github.com/dminh209/airdropmi14pro/releases/download/v1.0/wlan-patched.zip" || \
          curl -sSL -o wlan-patched.zip "https://github.com/dminh209/airdropmi14pro/releases/download/v1.0/wlan-patched.zip"
          mkdir -p wlan
          unzip -q -o wlan-patched.zip -d wlan
          rm -f wlan-patched.zip

      - name: Setup Vendor & Qualcomm IPA Headers
        shell: python
        run: |
          import os, urllib.request, base64

          os.makedirs('ack-6.1/include/linux', exist_ok=True)
          os.makedirs('ack-6.1/include/uapi/linux', exist_ok=True)
          os.makedirs('ack-6.1/include/soc/qcom', exist_ok=True)
          os.makedirs('ack-6.1/include/soc/oplus/system', exist_ok=True)
          os.makedirs('dataipa/drivers/platform/msm/include/uapi/linux', exist_ok=True)
          os.makedirs('dataipa/drivers/platform/msm/include/linux', exist_ok=True)

          # 1. qcom-iommu-util.h
          with open('ack-6.1/include/linux/qcom-iommu-util.h', 'w') as f:
              f.write('''#ifndef _LINUX_QCOM_IOMMU_UTIL_H
          #define _LINUX_QCOM_IOMMU_UTIL_H
          #include <linux/types.h>
          #include <linux/iommu.h>
          #define QCOM_IOMMU_MAPPING_CONF_S1_BYPASS 1
          #define QCOM_IOMMU_MAPPING_CONF_ATOMIC 2
          #define QCOM_IOMMU_MAPPING_CONF_FAST 4
          static inline int qcom_iommu_get_mappings_configuration(struct iommu_domain *domain) { return 0; }
          #endif
          ''')

          # 2. boot_stats.h
          with open('ack-6.1/include/soc/qcom/boot_stats.h', 'w') as f:
              f.write('''#ifndef _SOC_QCOM_BOOT_STATS_H
          #define _SOC_QCOM_BOOT_STATS_H
          static inline void place_marker(const char *name) {}
          #endif
          ''')

          # 3. oplus_project.h
          with open('ack-6.1/include/soc/oplus/system/oplus_project.h', 'w') as f:
              f.write('''#ifndef _SOC_OPLUS_SYSTEM_OPLUS_PROJECT_H_
          #define _SOC_OPLUS_SYSTEM_OPLUS_PROJECT_H_
          #include <linux/types.h>
          enum { RELEASE = 0, DEBUG, AGING, USER };
          static inline int get_eng_version(void) { return 0; }
          static inline int get_project(void) { return 0; }
          static inline bool is_project(int project) { return false; }
          #endif
          ''')

          # 4. boot_mode.h
          with open('ack-6.1/include/soc/oplus/system/boot_mode.h', 'w') as f:
              f.write('''#ifndef _SOC_OPLUS_SYSTEM_BOOT_MODE_H_
          #define _SOC_OPLUS_SYSTEM_BOOT_MODE_H_
          #define MSM_BOOT_MODE__NORMAL 0
          #define MSM_BOOT_MODE__WLAN 1
          static inline int get_boot_mode(void) { return 0; }
          #endif
          ''')

          # 5. msm_gsi.h & msm-sps.h
          with open('ack-6.1/include/linux/msm_gsi.h', 'w') as f:
              f.write('''#ifndef _LINUX_MSM_GSI_H
          #define _LINUX_MSM_GSI_H
          enum gsi_prefetch_mode { GSI_USE_PREFETCH, GSI_ESCAPE_PREFETCH_OPT };
          #endif
          ''')

          with open('ack-6.1/include/linux/msm-sps.h', 'w') as f:
              f.write('''#ifndef _LINUX_MSM_SPS_H
          #define _LINUX_MSM_SPS_H
          #include <linux/types.h>
          struct sps_mem_buffer { u32 base; u32 size; phys_addr_t phys_base; };
          struct sps_iovec { u32 addr; u32 size; u32 flags; };
          #endif
          ''')

          # 6. Fetch Official Qualcomm IPA headers from Google AOSP Kernel repo with Fallbacks
          branch = 'android-msm-coral-4.14-android12'
          base_gs = f'https://android.googlesource.com/kernel/msm/+/refs/heads/{branch}'

          extra_ipa_stubs = '''
          #ifndef _LINUX_EXTRA_IPA_STUBS_H
          #define _LINUX_EXTRA_IPA_STUBS_H

          /* Additional IPA definitions for modern Qualcomm kernels */
          struct ipa_wdi_bw_info {
              uint32_t threshold[3];
              bool stop;
          };

          struct ipa_wdi_capabilities_out_params {
              uint8_t num_of_instances;
          };

          struct ipa_wdi_init_in_params_inst {
              uint8_t inst_id;
          };

          struct ipa_wdi_init_out_params_inst {
              uint8_t hdl;
          };

          struct ipa_wdi_tx_info {
              uint64_t sta_tx;
              uint64_t ap_tx;
          };

          struct ipa_inform_wlan_bw {
              uint32_t index;
              uint32_t throughput;
          };

          struct ipa_ast_info_type {
              uint8_t data[64];
          };

          static inline int ipa_uc_bw_monitor(struct ipa_wdi_bw_info *bw_info) { return 0; }
          static inline int ipa_wdi_sw_stats(struct ipa_wdi_tx_info *tx_stats) { return 0; }
          static inline int ipa_wdi_get_capabilities(struct ipa_wdi_capabilities_out_params *out) {
              if (out) out->num_of_instances = 1;
              return 1;
          }

          #endif /* _LINUX_EXTRA_IPA_STUBS_H */
          '''

          extra_wdi3_stubs = '''
          #ifndef _LINUX_EXTRA_IPA_WDI3_STUBS_H
          #define _LINUX_EXTRA_IPA_WDI3_STUBS_H

          /* Modern Qualcomm IPA WDI3 per-instance extensions */
          typedef uint8_t ipa_wdi_hdl_t;

          typedef void (*ipa_wdi_opt_dpath_flt_rsrv_cb)(void *priv, bool is_success);
          typedef void (*ipa_wdi_opt_dpath_flt_rsrv_rel_cb)(void *priv, bool is_success);
          typedef void (*ipa_wdi_opt_dpath_flt_add_cb)(void *priv, bool is_success);
          typedef void (*ipa_wdi_opt_dpath_flt_rem_cb)(void *priv, bool is_success);

          static inline int ipa_wdi_init_per_inst(struct ipa_wdi_init_in_params *in, struct ipa_wdi_init_out_params *out) { return -19; }
          static inline int ipa_wdi_cleanup_per_inst(ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_reg_intf_per_inst(struct ipa_wdi_reg_intf_in_params *in) { return 0; }
          static inline int ipa_wdi_dereg_intf_per_inst(const char *netdev_name, ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_conn_pipes_per_inst(struct ipa_wdi_conn_in_params *in, struct ipa_wdi_conn_out_params *out) { return -19; }
          static inline int ipa_wdi_disconn_pipes_per_inst(ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_enable_pipes_per_inst(ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_disable_pipes_per_inst(ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_set_perf_profile_per_inst(ipa_wdi_hdl_t hdl, struct ipa_wdi_perf_profile *profile) { return 0; }
          static inline int ipa_wdi_create_smmu_mapping_per_inst(ipa_wdi_hdl_t hdl, u32 num_buffers, struct ipa_wdi_buffer_info *info) { return 0; }
          static inline int ipa_wdi_release_smmu_mapping_per_inst(ipa_wdi_hdl_t hdl, u32 num_buffers, struct ipa_wdi_buffer_info *info) { return 0; }
          static inline int ipa_wdi_opt_dpath_register_flt_cb_per_inst(ipa_wdi_hdl_t hdl, ipa_wdi_opt_dpath_flt_rsrv_cb flt_rsrv_cb, ipa_wdi_opt_dpath_flt_rsrv_rel_cb flt_rsrv_rel_cb, ipa_wdi_opt_dpath_flt_add_cb flt_add_cb, ipa_wdi_opt_dpath_flt_rem_cb flt_rem_cb) { return 0; }
          static inline int ipa_wdi_opt_dpath_notify_flt_rsvd_per_inst(ipa_wdi_hdl_t hdl, bool is_success) { return 0; }
          static inline int ipa_wdi_opt_dpath_notify_flt_rlsd_per_inst(ipa_wdi_hdl_t hdl, bool is_success) { return 0; }

          #endif /* _LINUX_EXTRA_IPA_WDI3_STUBS_H */
          '''


          files_to_stage = {
              'include/linux/ipa.h': [
                  'ack-6.1/include/linux/ipa.h',
                  'dataipa/drivers/platform/msm/include/linux/ipa.h'
              ],
              'include/linux/ipa_wdi3.h': [
                  'ack-6.1/include/linux/ipa_wdi3.h',
                  'dataipa/drivers/platform/msm/include/linux/ipa_wdi3.h'
              ],
              'include/uapi/linux/msm_ipa.h': [
                  'ack-6.1/include/linux/msm_ipa.h',
                  'ack-6.1/include/uapi/linux/msm_ipa.h',
                  'dataipa/drivers/platform/msm/include/uapi/linux/msm_ipa.h',
                  'dataipa/drivers/platform/msm/include/linux/msm_ipa.h'
              ],
              'include/linux/ipa_uc_offload.h': [
                  'dataipa/drivers/platform/msm/include/ipa_uc_offload.h',
                  'ack-6.1/include/linux/ipa_uc_offload.h'
              ]
          }

          for remote_path, local_targets in files_to_stage.items():
              url = f"{base_gs}/{remote_path}?format=TEXT"
              fetched = False
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'curl/7.88.1'})
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      content = base64.b64decode(resp.read()).decode('utf-8', errors='ignore')
                      if remote_path == 'include/linux/ipa.h':
                          content += '\n' + extra_ipa_stubs
                      elif remote_path == 'include/linux/ipa_wdi3.h':
                          idx = content.rfind('#endif')
                          if idx != -1:
                              content = content[:idx] + '\n' + extra_wdi3_stubs + '\n' + content[idx:]
                          else:
                              content += '\n' + extra_wdi3_stubs
                      for t in local_targets:
                          with open(t, 'w') as out_f:
                              out_f.write(content)
                      print(f"Fetched {remote_path} successfully")
                      fetched = True
              except Exception as e:
                  print(f"Warning fetching {remote_path}: {e}")

              if not fetched:
                  if 'ipa_wdi3' in remote_path:
                      fallback_hdr = '''#ifndef _IPA_WDI3_H_
          #define _IPA_WDI3_H_
          #include <linux/ipa.h>
          ''' + extra_wdi3_stubs + '''
          #endif
          '''
                  else:
                      fallback_hdr = '''#ifndef _LINUX_IPA_FALLBACK_H
          #define _LINUX_IPA_FALLBACK_H
          #include <linux/types.h>
          #include <linux/device.h>
          enum ipa_hw_type { IPA_HW_None = 0, IPA_HW_v1_0 = 1, IPA_HW_v3_0 = 7, IPA_HW_MAX = 30 };
          enum ipa_client_type { IPA_CLIENT_MAX = 100 };
          static inline enum ipa_hw_type ipa_get_hw_type(void) { return IPA_HW_None; }
          static inline bool ipa_is_ready(void) { return false; }
          #endif
          ''' + extra_ipa_stubs
                  for t in local_targets:
                      with open(t, 'w') as out_f:
                          out_f.write(fallback_hdr)
                  print(f"Wrote fallback for {remote_path}")

          # Patch modern WDI3/IPA fields required by SM8650/Kiwi-v2 driver
          for p_wdi in [
              'ack-6.1/include/linux/ipa_wdi3.h',
              'dataipa/drivers/platform/msm/include/linux/ipa_wdi3.h',
          ]:
              if os.path.exists(p_wdi):
                  c = open(p_wdi, 'r', encoding='utf-8', errors='ignore').read()
                  if 'IPA_WDI_3_V2' not in c:
                      c = c.replace('IPA_WDI_3\n};', 'IPA_WDI_3,\n\tIPA_WDI_3_V2\n};')
                  if 'uint8_t inst_id;' not in c:
                      c = c.replace('void *priv;\n#ifdef IPA_WAN_MSG_IPv6_ADDR_GW_LEN', 'void *priv;\n\tuint8_t inst_id;\n#ifdef IPA_WAN_MSG_IPv6_ADDR_GW_LEN')
                  if 'bool is_over_gsi;\n\tuint8_t hdl;' not in c:
                      c = c.replace('bool is_over_gsi;\n};', 'bool is_over_gsi;\n\tuint8_t hdl;\n};')
                  if 'u32 meta_data_mask;\n\tuint8_t hdl;' not in c:
                      c = c.replace('u32 meta_data_mask;\n};', 'u32 meta_data_mask;\n\tuint8_t hdl;\n};')
                  if 'u8 rx_bank_id;' not in c:
                      c = c.replace('u32  desc_format_template[IPA_HW_WDI3_MAX_ER_DESC_SIZE];\n};', 'u32  desc_format_template[IPA_HW_WDI3_MAX_ER_DESC_SIZE];\n\tu8 rx_bank_id;\n};')
                      c = c.replace('u32 desc_format_template[IPA_HW_WDI3_MAX_ER_DESC_SIZE];\n};', 'u32 desc_format_template[IPA_HW_WDI3_MAX_ER_DESC_SIZE];\n\tu8 rx_bank_id;\n};')
                  idx2 = c.find('struct ipa_wdi_pipe_setup_info_smmu {')
                  if idx2 != -1:
                      end2 = c.find('};', idx2)
                      if 'rx_bank_id' not in c[idx2:end2]:
                          c = c[:end2] + '\tu8 rx_bank_id;\n' + c[end2:]
                  idx3 = c.find('struct ipa_wdi_conn_in_params {')
                  if idx3 != -1:
                      end3 = c.find('};', idx3)
                      if 'hdl;' not in c[idx3:end3]:
                          c = c[:end3] + '\tuint8_t hdl;\n' + c[end3:]
                  if 'bool is_ddr_mapped;' not in c:
                      c = c.replace('phys_addr_t rx_uc_db_pa;\n};', 'phys_addr_t rx_uc_db_pa;\n\tbool is_ddr_mapped;\n};')
                  open(p_wdi, 'w', encoding='utf-8').write(c)

          for p_msm in [
              'ack-6.1/include/linux/msm_ipa.h',
              'ack-6.1/include/uapi/linux/msm_ipa.h',
              'dataipa/drivers/platform/msm/include/uapi/linux/msm_ipa.h',
              'dataipa/drivers/platform/msm/include/linux/msm_ipa.h',
          ]:
              if os.path.exists(p_msm):
                  c = open(p_msm, 'r', encoding='utf-8', errors='ignore').read()
                  if 'IPA_CLIENT_WLAN3_PROD' not in c:
                      c = c.replace('#define IPA_CLIENT_WLAN2_PROD IPA_CLIENT_A5_WLAN_AMPDU_PROD', '#define IPA_CLIENT_WLAN2_PROD IPA_CLIENT_A5_WLAN_AMPDU_PROD\n#define IPA_CLIENT_WLAN3_PROD IPA_CLIENT_A5_WLAN_AMPDU_PROD')
                  idx = c.find('struct ipa_wlan_msg {')
                  if idx != -1:
                      end = c.find('};', idx)
                      if 'if_index' not in c[idx:end]:
                          c = c[:end] + '\tuint32_t if_index;\n' + c[end:]
                  open(p_msm, 'w', encoding='utf-8').write(c)

          print("Qualcomm IPA and vendor headers setup complete!")

      - name: Prepare Kernel Headers (Exact Shennong 0x440 & GKI ABI)
        run: |
          cd "$GITHUB_WORKSPACE/ack-6.1"
          rm -f .scmversion localversion*
          touch .scmversion
          make ARCH=arm64 LLVM=1 LOCALVERSION="" gki_defconfig
          scripts/config --enable CONFIG_MODULES
          scripts/config --enable CONFIG_WLAN
          scripts/config --enable CONFIG_CFG80211
          scripts/config --enable CONFIG_MAC80211
          scripts/config --enable CONFIG_NL80211_TESTMODE
          scripts/config --disable CONFIG_CFG80211_WEXT
          scripts/config --disable CONFIG_MAC80211_DEBUGFS
          scripts/config --enable CONFIG_DEBUG_INFO_BTF
          scripts/config --enable CONFIG_DEBUG_INFO_BTF_MODULES
          scripts/config --disable CONFIG_LOCALVERSION_AUTO
          scripts/config --set-str CONFIG_LOCALVERSION "-android14-11-g0c3d559bcd85-ab14529422"
          make ARCH=arm64 LLVM=1 LOCALVERSION="" olddefconfig
          sed -i 's/next_path = strchr(s,/next_path = (char *)strchr(s,/g' tools/lib/bpf/libbpf.c 2>/dev/null || true
          sed -i 's/s = strchr(s,/s = (char *)strchr(s,/g' tools/lib/bpf/libbpf.c 2>/dev/null || true
          sed -i 's/-Werror//g' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true
          sed -i 's/-Werror//g' tools/lib/bpf/Makefile 2>/dev/null || true
          sed -i 's/-Werror//g' tools/build/Makefile.build 2>/dev/null || true
          make -j$(nproc) ARCH=arm64 LLVM=1 LOCALVERSION="" WERROR=0 HOSTCFLAGS="-w" modules_prepare
          REL=$(cat include/config/kernel.release)
          echo "Verified kernel.release: $REL"
          if [ "$REL" != "6.1.138-android14-11-g0c3d559bcd85-ab14529422" ]; then
            echo "FATAL: kernel.release mismatch ($REL)"
            exit 1
          fi

      - name: Generate Complete Shennong & GKI Module.symvers
        shell: python
        run: |
          import os, re, zlib, base64

          stg_path = os.path.join(os.environ['GITHUB_WORKSPACE'], 'ack-6.1', 'android', 'abi_gki_aarch64.stg')
          out_symvers = os.path.join(os.environ['GITHUB_WORKSPACE'], 'ack-6.1', 'Module.symvers')

          stg_txt = open(stg_path, 'r', encoding='utf-8', errors='ignore').read()
          entries = {}
          for m in re.finditer(r'elf_symbol\s*\{([^}]+)\}', stg_txt):
              blk = m.group(1)
              nm = re.search(r'name:\s*"([^"]+)"', blk)
              cr = re.search(r'crc:\s*(0x[0-9a-fA-F]+|\d+)', blk)
              if nm and cr:
                  entries[nm.group(1)] = (int(cr.group(1), 0) & 0xffffffff, 'vmlinux')

          assert entries.get('module_layout', (None,))[0] == 0xea759d7f, "module_layout CRC mismatch in STG!"

          vendor_b64 = """
            eNqtncly5Dh3qNfyy/yYh60jvLs37LC9sFcMDAcSLWYyi2RKVX56H5BMJZiV1QFSvWm1Wq0vMZwZBxD5aUAZa6x6aZqQXg1hlDau
            6/rQwAecp2Z89y9nmP7x2Q7QwTj+4/Z/vfzLf/3bv/77fzb/8d///5//9f+9/BP5CZSz5KT+HTXApfu1BxVVDJYFWqIGF92wjKoW
            kzRJkkVXYkY4x/1z05oS61RAUgsAKyq8Qbx20Ew/f8ygkwvzT77+5XcQNdqm4OOLH9r4ir96PZ+ha97ARRhqRxOEisqF8HJf5/Ov
            5jo6j4MJby4jx+pFsjZRIm0BG0fctNCfwLvwXsshzlspAzxykmu76wC1GAYgCZGxwFynt2ZqT9Bfq3celJQqcXmn5Km8Dv0Vdz+4
            0DjfD9U0AcIyy1NBG0dcoK4fmnM/telX9c5R6a3WfEtK3XV8q15noiOL7GEw7VQvPsZGEsGKOyGvyC7NEtEY41FBC0QXrp2boPHt
            NODX6tFQ3BqudYF6a8bPdsIv+xaXi0gc6tEz0ji5YYK4kxitBiSWK4XaFSFl7bi4qUWFq943FZymKT5hDbBjvbRgSgr7hBPTiKb2
            xxUZsXrNkvXMJPI7bTEn9SbJixSY/p3z4bq2ejiUKEYjdyUGwntebt+eccH781hvAwCUEuqRhaKQOfMAX6sn6Bx1wUJhc0OHBg6F
            KX9XP0FBJOGyXKf+fJ6NZP2mKWWtdwa2EAhTE/tzvUByrp3erE9/noa+ay5oG9GpzSt1rV5vdHlaBFHYtvDj1HhwiG26Ho3UPuVD
            Tyk1C2bLu7xPB1g2SmLDRvmQNeD+7QQRxoyXLmxB00/Ya1mk5MkzVnCGdmouQz/1uO795VIvDs64IJjzd1bEkAI3rxnbc+qrbTq3
            XhNTOJbYjqtg1Q8mKaUoC4XJhJ/om86uWxx5NlAwTvUbp4J3vLBPqc0BXAen5uTQslebTesNQwP8AEKnF9GLZ161XXExAWHFDNMA
            uP8O1fh6DtVKLJywzhaSlKZ9TliSyEGTIsh5hSlHA9WCQwinXpAtIA4fe8SGaRmsTg+QFsZbJNqcrydfH50IrkyipTTPvDT9ukCW
            JYw0Lq5aGqW0Khq7hV3YpXHTVD0kHaznScKWsvqRasufSPCGFybodXpHdXiHX3sNowvocVSxQm0OAf+nb887fAjHIJuVMe26xDll
