name: Build Xiaomi 14 Pro AirDrop Driver

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Xiaomi 14 Pro AirDrop Driver
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libelf-dev libssl-dev \
            python3 python3-pip python3-yaml zip unzip curl wget git
          pip3 install --break-system-packages pyyaml pyelftools

      - name: Setup Official Google Clang (Android NDK r26d Toolchain)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/toolchain"
          cd "$GITHUB_WORKSPACE/toolchain"
          echo "Downloading Android NDK r26d..."
          curl -sSL -o ndk.zip https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          echo "Extracting Android NDK..."
          unzip -q ndk.zip
          rm ndk.zip
          
          # Discover real clang location dynamically
          CLANG_PATH=$(find "$GITHUB_WORKSPACE/toolchain" -type f -name "clang" | grep "bin/clang" | head -n 1)
          if [ -z "$CLANG_PATH" ]; then
            echo "ERROR: Could not find clang binary inside NDK!"
            exit 1
          fi
          TOOLCHAIN_BIN=$(dirname "$CLANG_PATH")
          echo "Found LLVM Toolchain at: $TOOLCHAIN_BIN"
          echo "$TOOLCHAIN_BIN" >> $GITHUB_PATH
          echo "TOOLCHAIN_BIN=$TOOLCHAIN_BIN" >> $GITHUB_ENV

      - name: Verify Clang Version
        run: |
          "$TOOLCHAIN_BIN/clang" --version
          export PATH="$TOOLCHAIN_BIN:$PATH"
          clang --version

      - name: Download ACK Kernel 6.1 (Commit 0c3d559bcd85)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p ack-6.1
          echo "Cloning shallow ACK 6.1 tree commit 0c3d559bcd85..."
          git init ack-6.1
          cd ack-6.1
          git remote add origin https://android.googlesource.com/kernel/common
          git fetch --depth 1 origin 0c3d559bcd85412534a74939b4b1a45741639d67
          git checkout FETCH_HEAD

      - name: Download wlan-patched Source from Release
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p wlan
          curl -sSL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -o wlan.zip \
            https://github.com/dminh209/airdropmi14pro/releases/download/v1.0.0/wlan-patched.zip
          unzip -q wlan.zip -d wlan/
          rm wlan.zip

      - name: Setup Vendor & Qualcomm IPA Headers
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$GITHUB_WORKSPACE/wlan/wonder/include/wonder"
          mkdir -p "$GITHUB_WORKSPACE/wlan/platform/inc"
          mkdir -p "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux"

          # 1. WonderTAP header
          cat << 'EOF' > "$GITHUB_WORKSPACE/wlan/wonder/include/wonder/wondertap.h"
          #ifndef _WONDERTAP_H_
          #define _WONDERTAP_H_
          #include <linux/types.h>
          #include <linux/netdevice.h>
          #include <linux/skbuff.h>

          enum wondertap_rate_bw { WONDERTAP_RATE_BW_20, WONDERTAP_RATE_BW_40, WONDERTAP_RATE_BW_80, WONDERTAP_RATE_BW_160 };
          enum wondertap_rate_preamble { WONDERTAP_RATE_PREAMBLE_LEGACY, WONDERTAP_RATE_PREAMBLE_HT, WONDERTAP_RATE_PREAMBLE_VHT, WONDERTAP_RATE_PREAMBLE_HE };
          enum wondertap_filter_type { WONDERTAP_FILTER_PROMISC = 1, WONDERTAP_FILTER_BSSID = 2 };

          struct wondertap_set_freq_params { uint32_t freq; };
          struct wondertap_fixed_tx_rate_params { uint32_t rate; };
          struct wondertap_init_params { void *priv; };
          struct wondertap_deinit_params { void *priv; };
          struct wondertap_frame_filter_params { uint16_t filter; };
          struct wondertap_bssid_filter_params { uint8_t bssid[6]; };
          struct wondertap_tx_rate_mask_params { uint32_t mask; };
          struct wondertap_capability { uint32_t cap; };
          struct wondertap_priv { void *data; };

          struct wondertap_ops {
              int (*init)(struct net_device *dev, struct wondertap_init_params *params);
              int (*deinit)(struct net_device *dev, struct wondertap_deinit_params *params);
              int (*tx)(struct net_device *dev, struct sk_buff *skb);
              int (*set_freq)(struct net_device *dev, struct wondertap_set_freq_params *params);
              int (*set_frame_filter)(struct net_device *dev, struct wondertap_frame_filter_params *params);
              int (*set_bssid_filter)(struct net_device *dev, struct wondertap_bssid_filter_params *params);
              int (*set_tx_rate_mask)(struct net_device *dev, struct wondertap_tx_rate_mask_params *params);
              int (*get_capability)(struct net_device *dev, struct wondertap_capability *params);
          };

          extern int wondertap_register_device(struct net_device *dev, struct wondertap_ops *ops, void *priv);
          extern void wondertap_unregister_device(struct net_device *dev);
          extern void wondertap_rx(struct net_device *dev, struct sk_buff *skb);
          #endif
          EOF

          # 2. Platform cnss2 stubs
          cat << 'EOF' > "$GITHUB_WORKSPACE/wlan/platform/inc/cnss2.h"
          #ifndef _CNSS2_H_
          #define _CNSS2_H_
          #include <linux/device.h>
          #include <linux/pci.h>
          enum cnss_bus_width_type { CNSS_BUS_WIDTH_NONE = 0, CNSS_BUS_WIDTH_LOW, CNSS_BUS_WIDTH_MEDIUM, CNSS_BUS_WIDTH_HIGH, CNSS_BUS_WIDTH_VERY_HIGH };
          static inline int cnss_wlan_register_driver(void *driver) { return 0; }
          static inline void cnss_wlan_unregister_driver(void *driver) {}
          static inline int cnss_set_vendor_wonder_priv_data(const void *priv_data) { return 0; }
          static inline void *cnss_get_vendor_wonder_priv_data(void) { return NULL; }
          #endif
          EOF

          # 3. Qualcomm IPA headers
          echo "Fetching Qualcomm IPA headers from android.googlesource.com..."
          BASE_IPA="https://android.googlesource.com/kernel/msm-modules/data-ipa/+/refs/heads/android14-6.1/drivers/platform/msm/include"
          for hdr in ipa.h ipa_wdi3.h msm_ipa.h ipa_uc_offload.h; do
            curl -sSL "${BASE_IPA}/${hdr}?format=TEXT" | base64 --decode > "$GITHUB_WORKSPACE/ack-6.1/include/linux/${hdr}" 2>/dev/null || true
            cp "$GITHUB_WORKSPACE/ack-6.1/include/linux/${hdr}" "$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux/${hdr}" 2>/dev/null || true
          done

          # Fetch SPS and GSI headers
          BASE_DRV="https://android.googlesource.com/kernel/msm-modules/data-ipa/+/refs/heads/android14-6.1/drivers/platform/msm"
          curl -sSL "${BASE_DRV}/gsi/msm_gsi.h?format=TEXT" | base64 --decode > "$GITHUB_WORKSPACE/ack-6.1/include/linux/msm_gsi.h" 2>/dev/null || true
          curl -sSL "${BASE_DRV}/sps/msm-sps.h?format=TEXT" | base64 --decode > "$GITHUB_WORKSPACE/ack-6.1/include/linux/msm-sps.h" 2>/dev/null || true

          # Offline fallbacks & WDI3 multi-instance stubs
          python3 -c "
          import os

          extra_ipa_stubs = '''
          #ifndef _LINUX_EXTRA_IPA_STUBS_H
          #define _LINUX_EXTRA_IPA_STUBS_H

          #ifndef IPA_APPS_WAN_PROT_HDR_NAME
          #define IPA_APPS_WAN_PROT_HDR_NAME \"ipa_apps_wan_prot\"
          #endif
          #ifndef IPA_APPS_WAN_HDR_NAME
          #define IPA_APPS_WAN_HDR_NAME \"ipa_apps_wan\"
          #endif
          #ifndef IPA_APPS_LAN_HDR_NAME
          #define IPA_APPS_LAN_HDR_NAME \"ipa_apps_lan\"
          #endif

          struct ipa_wdi_init_out_params_inst {
              uint8_t is_smmu_enabled;
              uint8_t is_auto_smmu_enabled;
              uint8_t is_rx_mon_supported;
          };

          struct ipa_wdi_tx_info {
              uint32_t num_tx_pipes;
          };

          struct ipa_wdi_rx_info {
              uint32_t num_rx_pipes;
          };

          struct ipa_wdi_tx_pipe_info {
              uint32_t handle;
          };

          struct ipa_wdi_rx_pipe_info {
              uint32_t handle;
          };

          struct ipa_wdi_pipe_setup_info {
              uint32_t handle;
          };

          #endif /* _LINUX_EXTRA_IPA_STUBS_H */
          '''

          extra_wdi3_stubs = '''
          #ifndef _LINUX_EXTRA_WDI3_STUBS_H
          #define _LINUX_EXTRA_WDI3_STUBS_H

          typedef void *ipa_wdi_hdl_t;
          typedef void (*ipa_wdi_opt_dpath_flt_rsrv_cb)(ipa_wdi_hdl_t hdl, void *priv);
          typedef void (*ipa_wdi_opt_dpath_flt_rsrv_rel_cb)(ipa_wdi_hdl_t hdl, void *priv);
          typedef void (*ipa_wdi_meter_notifier_cb)(ipa_wdi_hdl_t hdl, void *priv);

          static inline int ipa_wdi_reg_opt_dpath_flt_rsrv_cb_per_inst(ipa_wdi_hdl_t hdl, ipa_wdi_opt_dpath_flt_rsrv_cb flt_rsrv_cb, ipa_wdi_opt_dpath_flt_rsrv_rel_cb flt_rsrv_rel_cb, void *user_data) { return 0; }
          static inline int ipa_wdi_dereg_opt_dpath_flt_rsrv_cb_per_inst(ipa_wdi_hdl_t hdl) { return 0; }
          static inline int ipa_wdi_set_perf_profile_per_inst(ipa_wdi_hdl_t hdl, void *profile) { return 0; }

          #endif /* _LINUX_EXTRA_WDI3_STUBS_H */
          '''

          for base_dir in ['$GITHUB_WORKSPACE/ack-6.1/include/linux', '$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi/linux']:
              p_ipa = os.path.expandvars(os.path.join(base_dir, 'ipa.h'))
              if os.path.exists(p_ipa):
                  with open(p_ipa, 'r') as f:
                      content = f.read()
                  if '_LINUX_EXTRA_IPA_STUBS_H' not in content:
                      with open(p_ipa, 'a') as f:
                          f.write(extra_ipa_stubs)

              p_wdi3 = os.path.expandvars(os.path.join(base_dir, 'ipa_wdi3.h'))
              if os.path.exists(p_wdi3):
                  with open(p_wdi3, 'r') as f:
                      content = f.read()
                  if '_LINUX_EXTRA_WDI3_STUBS_H' not in content:
                      with open(p_wdi3, 'a') as f:
                          f.write(extra_wdi3_stubs)
          "

      - name: Prepare Kernel Headers
        run: |
          cd "$GITHUB_WORKSPACE/ack-6.1"
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-

          make gki_defconfig
          scripts/config --set-str LOCALVERSION "-android14-11-g0c3d559bcd85-ab14529422"
          scripts/config --enable CONFIG_MODULES
          scripts/config --disable CONFIG_DEBUG_INFO_BTF
          scripts/config --disable CONFIG_DEBUG_INFO_BTF_MODULES

          # Patch libbpf host tool compilation issue under Clang 17
          python3 -c "
          import os
          p = 'tools/lib/bpf/libbpf.c'
          if os.path.exists(p):
              with open(p, 'r') as f: c = f.read()
              c = c.replace('next_path = strchr(s, \':\');', 'next_path = (char *)strchr(s, \':\');')
              with open(p, 'w') as f: f.write(c)
          "

          make WERROR=0 HOSTCFLAGS="-w" modules_prepare

      - name: Apply Source Patches (AWDL & Passthru Compatibility)
        shell: python
        working-directory: ${{ github.workspace }}/wlan/qcacld-3.0
        run: |
          import os, re

          # 1. Generate wlan_hdd_wondertap.h
          wt_h_content = '''#ifndef _WLAN_HDD_WONDERTAP_H_
          #define _WLAN_HDD_WONDERTAP_H_

          #include <linux/types.h>
          #include <linux/device.h>
          #include <wonder/wondertap.h>
          #include <cdp_txrx_cmn_struct.h>
          #include <wlan_dp_ucfg_api.h>
          #include <sme_api.h>
          #include <wlan_cm_roam_public_struct.h>

          typedef enum wondertap_rate_bw qdf_wondertap_rate_bw_t;
          typedef enum wondertap_rate_preamble qdf_wondertap_rate_preamble_t;
          typedef struct wondertap_set_freq_params qdf_wondertap_set_freq_params_t;
          typedef struct wondertap_fixed_tx_rate_params qdf_wondertap_tx_rate_params_t;
          typedef struct wondertap_init_params qdf_wondertap_init_params_t;
          typedef struct wondertap_deinit_params qdf_wondertap_deinit_params_t;
          typedef enum wondertap_filter_type qdf_wondertap_filter_type_t;
          typedef struct wondertap_frame_filter_params qdf_wondertap_frame_filter_params_t;
          typedef struct wondertap_bssid_filter_params qdf_wondertap_bssid_filter_params_t;
          typedef struct wondertap_tx_rate_mask_params qdf_wondertap_tx_rate_mask_params_t;
          typedef struct wondertap_capability qdf_wondertap_capability_t;
          typedef struct wondertap_ops qdf_wondertap_ops_t;
          typedef struct wondertap_priv qdf_wondertap_priv_t;

          struct hdd_wondertap_context {
              struct hdd_context *hdd_ctx;
              struct hdd_adapter *wt_adapter;
              unsigned long magic;
              bool vdev_is_up;
              bool is_frame_filter_set;
              uint16_t frame_filter;
              qdf_runtime_lock_t wondertap_rtpm_lock;
              qdf_event_t wondertap_vdev_event;
              qdf_wake_lock_t wondertap_wakelock;
          };

          #define WLAN_WONDERTAP_VDEV_OP_TIMEOUT_MS 2000
          #define WIFI_POWER_EVENT_WAKELOCK_PASSTHRU 0
          #define RSO_PASSTHRU_SET_CHANNEL RSO_CHANNEL_SWITCH

          #define sme_create_pe_session(mac, bssid, vdev, mode) sme_create_mon_session(mac, bssid, vdev)
          #define sme_delete_pe_session(mac, vdev, mode) sme_delete_mon_session(mac, vdev)
          #define ucfg_dp_passthrough_register_txrx_ops(vdev) ucfg_dp_mon_register_txrx_ops(vdev)

          static inline QDF_STATUS wlan_vdev_mgr_set_param_bssid(struct wlan_objmgr_vdev *vdev, const uint8_t *bssid)
          {
              return QDF_STATUS_SUCCESS;
          }

          extern int cnss_set_vendor_wonder_priv_data(const void *priv_data);
          static inline int pld_set_vendor_wonder_priv_data(struct device *dev, const void *priv)
          {
              return cnss_set_vendor_wonder_priv_data(priv);
          }

          #endif /* _WLAN_HDD_WONDERTAP_H_ */
          '''
          with open('core/hdd/inc/wlan_hdd_wondertap.h', 'w') as f:
              f.write(wt_h_content)

          # 2. Patch wlan_hdd_main.h
          with open('core/hdd/inc/wlan_hdd_main.h', 'r+') as f:
              c = f.read()
              lines = [l for l in c.splitlines(True) if 'enum sar_flag sar_flag' not in l]
              c = ''.join(lines)
              if 'struct freq_change_info ch_chng_info;\n\tqdf_work_t chan_change_notify_work;' not in c:
                  c = c.replace('struct freq_change_info ch_chng_info;', 'struct freq_change_info ch_chng_info;\n\tqdf_work_t chan_change_notify_work;')
              c = c.replace('hdd_sme_monitor_mode_callback(uint8_t vdev_id, bool is_up)', 'hdd_sme_monitor_mode_callback(uint8_t vdev_id)')
              c = c.replace('qdf_freq_t chan_freq, uint32_t ccfs1,', 'qdf_freq_t chan_freq,')
              c = c.replace('int32_t link_id, bool is_cache)', 'int32_t link_id)')
              c = c.replace('void hdd_component_psoc_close(struct wlan_objmgr_psoc *psoc,\n\t\t\t      bool is_recovering);', 'void hdd_component_psoc_close(struct wlan_objmgr_psoc *psoc);')
              c = c.replace('int wlan_hdd_set_channel(struct wlan_hdd_link_info *link_info,\n\t\t\t struct wiphy *wiphy,', 'int wlan_hdd_set_channel(struct wiphy *wiphy,')
              c = c.replace('bool update_self_peer,\n\t\t\t\tbool skip_reattach);', 'bool update_self_peer);')
              c = c.replace('bool update_self_peer,\n\t\t\t    bool skip_reattach)', 'bool update_self_peer)')
              c = c.replace('return hdd_dynamic_mac_address_set(adapter->deflink, mac_addr,\n\t\t\t\t\t   mld_addr, true, false);', 'return hdd_dynamic_mac_address_set(adapter->deflink, mac_addr, mld_addr, true);')
              c = c.replace('int wlan_hdd_set_mon_chan(struct hdd_adapter *adapter)', 'int wlan_hdd_set_mon_chan(struct hdd_adapter *adapter, qdf_freq_t freq, uint32_t bandwidth)')
              c = c.replace('void wlan_hdd_stop_sap(struct wlan_hdd_link_info *link_info);', 'void wlan_hdd_stop_sap(struct hdd_adapter *ap_adapter);')
              if 'struct hdd_mon_set_ch_info {' not in c:
                  c = c.replace('struct hdd_station_ctx {\n', 'struct hdd_mon_set_ch_info {\n\tenum phy_ch_width channel_width;\n\tuint32_t phy_mode;\n\tqdf_freq_t freq;\n\tenum phy_ch_width cb_mode;\n};\n\nstruct hdd_station_ctx {\n')
              if 'struct hdd_mon_set_ch_info ch_info;' not in c:
                  c = c.replace('\tuint8_t user_cfg_chn_width;\n};', '\tuint8_t user_cfg_chn_width;\n\tstruct hdd_mon_set_ch_info ch_info;\n};')
              if 'qdf_freq_t mon_chan_freq;' not in c:
                  c = c.replace('bool monitor_mode_vdev_up_in_progress;', 'bool monitor_mode_vdev_up_in_progress;\n\tqdf_freq_t mon_chan_freq;\n\tuint32_t mon_bandwidth;')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2b. Patch wlan_hdd_main.c (Remove duplicate rtnl lock definitions & fix policy_mgr_is_sta_sap_scc)
          with open('core/hdd/src/wlan_hdd_main.c', 'r+') as f:
              c = f.read()
              pattern = r'#if defined\(CONFIG_HDD_INIT_WITH_RTNL_LOCK\)[\s\S]*?static inline void hdd_release_rtnl_lock\(void\) \{ \}\s*#endif'
              if re.search(pattern, c):
                  c = re.sub(pattern, '/* duplicate hdd_hold_rtnl_lock & hdd_release_rtnl_lock removed (defined in wlan_hdd_main.h) */', c, count=1)
              c = c.replace('policy_mgr_is_sta_sap_scc(hdd_ctx->psoc,\n\t\t\t\t\t\t       ap_chan_freq)', 'policy_mgr_is_sta_sap_scc(hdd_ctx->psoc,\n\t\t\t\t\t\t       ap_chan_freq, false)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2c. Patch wlan_hdd_stats.c (Remove duplicate stubs and match non-static prototypes)
          with open('core/hdd/src/wlan_hdd_stats.c', 'r+') as f:
              c = f.read()
              c = c.replace('static bool wlan_hdd_is_mlo_connection', 'bool wlan_hdd_is_mlo_connection')
              c = c.replace('static bool\nwlan_hdd_is_link_switch_in_progress', 'bool\nwlan_hdd_is_link_switch_in_progress')
              c = re.sub(r'static inline bool\s+wlan_hdd_is_link_switch_in_progress\s*\([^)]*\)\s*\{\s*return false;\s*\}', '/* stub wlan_hdd_is_link_switch_in_progress removed (defined in wlan_hdd_main.h) */', c)
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2d. Patch dp_rx_mon.c (Guard dp_rx_rate_stats_update with #ifdef QCA_ENHANCED_STATS_SUPPORT)
          with open('../qca-wifi-host-cmn/dp/wifi3.0/monitor/dp_rx_mon.c', 'r+') as f:
              c = f.read()
              target = 'static inline void dp_rx_rate_stats_update(struct dp_peer *peer,'
              if target in c and '#ifdef QCA_ENHANCED_STATS_SUPPORT' not in c[:c.find(target)][-100:]:
                  c = c.replace(target, '#ifdef QCA_ENHANCED_STATS_SUPPORT\n' + target)
                  c = c.replace('peer->vdev->stats.rx.last_rx_rate = ratekbps;\n}', 'peer->vdev->stats.rx.last_rx_rate = ratekbps;\n}\n#endif /* QCA_ENHANCED_STATS_SUPPORT */')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2e. Patch policy_mgr_incr_active_session 3-argument calls across all callers
          for pm_caller in [
              'core/hdd/src/wlan_hdd_main.c',
              'core/hdd/src/wlan_hdd_hostapd.c',
              'components/nan/core/src/nan_main.c',
              'components/umac/mlme/connection_mgr/core/src/wlan_cm_roam_fw_sync.c'
          ]:
              if os.path.exists(pm_caller):
                  with open(pm_caller, 'r+') as f:
                      c = f.read()
                      def _repl_pm(m):
                          args_str = m.group(1)
                          args = [a.strip() for a in args_str.split(',')]
                          if len(args) == 3:
                              return f'policy_mgr_incr_active_session({args_str}, true);'
                          return m.group(0)
                      c_new = re.sub(r'policy_mgr_incr_active_session\s*\(([^;]*?)\);', _repl_pm, c, flags=re.DOTALL)
                      f.seek(0)
                      f.write(c_new)
                      f.truncate()

          # 2f. Patch policy_mgr_is_sta_sap_scc in wlan_policy_mgr_action.c
          with open('components/cmn_services/policy_mgr/src/wlan_policy_mgr_action.c', 'r+') as f:
              c = f.read()
              c = c.replace('policy_mgr_is_sta_sap_scc(psoc, sap_freq)', 'policy_mgr_is_sta_sap_scc(psoc, sap_freq, false)')
              c = c.replace('policy_mgr_is_sta_sap_scc(psoc, ch_freq)', 'policy_mgr_is_sta_sap_scc(psoc, ch_freq, false)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2g. Patch policy_mgr_get_valid_chans_from_range in sap_module.c
          with open('core/sap/src/sap_module.c', 'r+') as f:
              c = f.read()
              c = c.replace('status = policy_mgr_get_valid_chans_from_range(mac->psoc,\n\t\t\t\t\t\t\t       pcl_freqs,\n\t\t\t\t\t\t\t       &pcl_len,\n\t\t\t\t\t\t\t       mode);', 'status = policy_mgr_get_valid_chans_from_range(mac->psoc,\n\t\t\t\t\t\t\t       pcl_freqs,\n\t\t\t\t\t\t\t       &pcl_len,\n\t\t\t\t\t\t\t       mode,\n\t\t\t\t\t\t\t       sap_ctx->vdev_id);')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2h. Patch policy_mgr_is_sta_sap_scc in sap_ch_select.c
          with open('core/sap/src/sap_ch_select.c', 'r+') as f:
              c = f.read()
              c = c.replace('policy_mgr_is_sta_sap_scc(mac->psoc,\n\t\t\t\t\t\tch_info->chan_freq)', 'policy_mgr_is_sta_sap_scc(mac->psoc,\n\t\t\t\t\t\tch_info->chan_freq, false)')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 2i. Patch policy_mgr_get_vdev_same_freq_new_conn in wlan_policy_mgr_ucfg.c
          with open('components/cmn_services/policy_mgr/src/wlan_policy_mgr_ucfg.c', 'r+') as f:
              c = f.read()
              c = c.replace('return policy_mgr_get_vdev_same_freq_new_conn(psoc, new_freq, vdev_id);', 'return policy_mgr_get_vdev_same_freq_new_conn(psoc, WLAN_INVALID_VDEV_ID, new_freq, vdev_id);')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 3. Patch wlan_hdd_cfg80211.c
          with open('core/hdd/src/wlan_hdd_cfg80211.c', 'r+') as f:
              c = f.read()
              lines = [l for l in c.splitlines(True) if '.testmode_cmd' not in l]
              c = ''.join(lines)
              f.seek(0)
              f.write(c)
              f.truncate()

          # 4. Patch wlan_policy_mgr_api.h
          with open('components/cmn_services/policy_mgr/inc/wlan_policy_mgr_api.h', 'r+') as f:
              c = f.read()
              lines = [l for l in c.splitlines(True) if 'PM_SCC_ON_5_SCC_ON_24_5G_24G' not in l and 'PM_SCC_ON_5_5G_SCC_ON_24_24G' not in l]
              c = ''.join(lines)
              if 'policy_mgr_get_pcl_channel_for_ll_sap_concurrency' not in c:
                  stub = '''static inline void policy_mgr_get_pcl_channel_for_ll_sap_concurrency(struct wlan_objmgr_psoc *psoc, uint8_t vdev_id, qdf_freq_t *pcl_chan_freq, uint8_t *pcl_channels_weight_list, uint32_t *pcl_ch_count) {}

          static inline bool policy_mgr_is_ll_sap_concurrency_valid(struct wlan_objmgr_psoc *psoc, qdf_freq_t chan_freq, uint32_t mode) { return true; }

          static inline bool policy_mgr_is_given_freq_5g_low(struct wlan_objmgr_psoc *psoc, qdf_freq_t freq) { return false; }

          '''
                  c = c.replace('bool policy_mgr_mon_sbs_mac0_freq', stub + 'bool policy_mgr_mon_sbs_mac0_freq')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 5. Patch wlan_policy_mgr_public_struct.h
          with open('components/cmn_services/policy_mgr/inc/wlan_policy_mgr_public_struct.h', 'r+') as f:
              c = f.read()
              if 'PM_PASSTHRU_MODE' not in c:
                  c = c.replace('PM_MAX_NUM_OF_MODE', 'PM_PASSTHRU_MODE,\n\tPM_MAX_NUM_OF_MODE')
                  f.seek(0)
                  f.write(c)
                  f.truncate()

          # 6. Patch qdf_types.h
          with open('../qca-wifi-host-cmn/qdf/inc/qdf_types.h', 'r+') as f:
              c = f.read()
              if 'QDF_PASSTHRU_MODE' not in c:
                  c = c.replace('QDF_MAX_NO_OF_MODE', 'QDF_PASSTHRU_MODE,\n\tQDF_MAX_NO_OF_MODE')
                  f.seek(0)
                  f.write(c)
                  f.truncate()

          # 7. Patch cdp_txrx_cmn_struct.h
          with open('../qca-wifi-host-cmn/dp/inc/cdp_txrx_cmn_struct.h', 'r+') as f:
              c = f.read()
              if 'CDP_VDEV_SET_PASSTHRU_FREQ' not in c:
                  c = c.replace('CDP_VDEV_SET_MAC_ADDR,', 'CDP_VDEV_SET_MAC_ADDR,\n\tCDP_VDEV_SET_PASSTHRU_FREQ,')
              if 'cdp_passthru_vdev_freq' not in c:
                  c = c.replace('uint8_t cdp_monitor_flag;\n} cdp_config_param_type;', 'uint8_t cdp_monitor_flag;\n\tuint32_t cdp_passthru_vdev_freq;\n} cdp_config_param_type;')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 8. Patch wlan_hdd_opairshare_aux_rx.h
          with open('core/hdd/src/wlan_hdd_opairshare_aux_rx.h', 'r+') as f:
              c = f.read()
              c = c.replace('ret = wlan_hdd_set_mon_chan(mon);', 'ret = wlan_hdd_set_mon_chan(mon, ctx->freq, ctx->bandwidth);')
              c = c.replace('ret = wlan_hdd_set_mon_chan(opairshare_aux_adapter);', 'ret = wlan_hdd_set_mon_chan(opairshare_aux_adapter, ctx->freq, CH_WIDTH_20MHZ);')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 9. Patch wlan_hdd_wondertap.c
          with open('core/hdd/src/wlan_hdd_wondertap.c', 'r+') as f:
              c = f.read()
              c = c.replace('hdd_validate_channel_and_bandwidth(adapter, params->freq, 0,', 'hdd_validate_channel_and_bandwidth(adapter, params->freq,')
              c = c.replace('hdd_validate_channel_and_bandwidth(adapter, params->freq,  0,', 'hdd_validate_channel_and_bandwidth(adapter, params->freq,')
              c = c.replace('bool opairshare_passthru_monitor_active(void);', 'static inline bool opairshare_passthru_monitor_active(void) { return false; }')
              f.seek(0)
              f.write(c)
              f.truncate()

          # 10. Patch Kbuild to link wlan_hdd_wondertap.o
          with open('Kbuild', 'r+') as f:
              c = f.read()
              if 'wlan_hdd_wondertap.o' not in c:
                  c = c.replace('$(HDD_SRC_DIR)/wlan_hdd_tx_rx.o \\', '$(HDD_SRC_DIR)/wlan_hdd_tx_rx.o \\\n\t\t$(HDD_SRC_DIR)/wlan_hdd_wondertap.o \\')
                  f.seek(0)
                  f.write(c)
                  f.truncate()

          # 11. Include wma_opairshare_pas_mgmt.h in wma_data.c
          with open('core/wma/src/wma_data.c', 'r+') as f:
              c = f.read()
              if 'wma_opairshare_pas_mgmt.h' not in c:
                  f.write('\n#include "wma_opairshare_pas_mgmt.h"\n')

          # 12. Disable NL80211_TESTMODE in profile
          with open('configs/pineapple_gki_kiwi-v2_defconfig', 'r+') as f:
              c = f.read()
              c = c.replace('CONFIG_NL80211_TESTMODE=y', '# CONFIG_NL80211_TESTMODE is not set')
              c = c.replace('CONFIG_IPA_OPT_WIFI_DP=y', '# CONFIG_IPA_OPT_WIFI_DP is not set')
              c = c.replace('CONFIG_QCA_WIFI_FTM_NL80211=y', '# CONFIG_QCA_WIFI_FTM_NL80211 is not set')
              f.seek(0)
              f.write(c)
              f.truncate()

          print("ALL SOURCE PATCHES APPLIED CLEANLY AND SAFELY!")

      - name: Compile AWDL Kernel Modules (including qca_cld3_kiwi_v2.ko)
        run: |
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KERNEL_SRC="$GITHUB_WORKSPACE/ack-6.1"
          export KBUILD_MODPOST_WARN=1
          export WERROR=0
          export LOCALVERSION="-android14-11-g0c3d559bcd85-ab14529422"

          mkdir -p "$GITHUB_WORKSPACE/output"

          # 1. Compile wonder.ko
          if [ -d "$GITHUB_WORKSPACE/wlan/wonder" ]; then
            cd "$GITHUB_WORKSPACE/wlan/wonder"
            echo 'KCFLAGS += -I$(src)/include -I$(src)' > Makefile.include
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$PWD/include -I$PWD" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f wonder.ko ] && cp wonder.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 2. Compile wonder provider & probe
          if [ -d "$GITHUB_WORKSPACE/wlan/provider" ]; then
            cd "$GITHUB_WORKSPACE/wlan/provider"
            echo "obj-m += opairshare_wonder_provider.o" > Kbuild
            echo "opairshare_wonder_provider-y := provider.o" >> Kbuild
            echo "obj-m += opairshare_route_b_probe.o" >> Kbuild
            echo "opairshare_route_b_probe-y := probe.o" >> Kbuild
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 KCFLAGS="-w -I$GITHUB_WORKSPACE/wlan/wonder/include -I$GITHUB_WORKSPACE/wlan/wonder" \
              KBUILD_MODPOST_WARN=1 modules || true
            [ -f opairshare_wonder_provider.ko ] && cp opairshare_wonder_provider.ko "$GITHUB_WORKSPACE/output/"
            [ -f opairshare_route_b_probe.ko ] && cp opairshare_route_b_probe.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 3. Compile patched qca_cld3_kiwi_v2.ko (PASSTHRU / AWDL enabled)
          if [ -d "$GITHUB_WORKSPACE/wlan/qcacld-3.0" ]; then
            cd "$GITHUB_WORKSPACE/wlan/qcacld-3.0"
            ln -sfn "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" cmn

            # Directory symlinks for fw-api to satisfy api/fw/wmi.h includes
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/soc"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" soc

            set -o pipefail
            make -j$(nproc) -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 WERROR=0 \
              MODNAME=qca_cld3_kiwi_v2 \
              CONFIG_QCA_CLD_WLAN=m \
              CONFIG_QCA_CLD_WLAN_PROFILE=pineapple_gki_kiwi-v2 \
              CONFIG_QCA_WIFI_ISOC=0 \
              CONFIG_QCA_WIFI_2_0=1 \
              WLAN_ROOT="$PWD" \
              WLAN_COMMON_ROOT=cmn \
              WLAN_COMMON_INC="$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" \
              WLAN_FW_API="$GITHUB_WORKSPACE/wlan/fw-api" \
              WLAN_PLATFORM_INC="$GITHUB_WORKSPACE/wlan/platform/inc" \
              DATA_IPA_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include" \
              DATA_IPA_UAPI_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KCFLAGS="-w -DDRIVER_PASSTHRU_MODE -DCONFIG_IPA3=1 -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              EXTRA_CFLAGS="-w -DDRIVER_PASSTHRU_MODE -DCONFIG_IPA3=1 -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/qca_build.log || {
                echo "=== FIRST COMPILE ERRORS ==="
                grep -m 25 -B 1 -A 2 "fatal error:\|error:" /tmp/qca_build.log || tail -n 50 /tmp/qca_build.log
                exit 1
              }
            [ -f qca_cld3_kiwi_v2.ko ] || { echo "ERROR: qca_cld3_kiwi_v2.ko was not built!"; exit 1; }
            cp qca_cld3_kiwi_v2.ko "$GITHUB_WORKSPACE/output/"
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Patch Module Layout & CRC (Xiaomi 14 Pro Shennong Spec)
        shell: python
        working-directory: ${{ github.workspace }}/output
        run: |
          import struct, os
          from elftools.elf.elffile import ELFFile

          # Xiaomi 14 Pro (Shennong Kernel 6.1.138-android14-11-g0c3d559bcd85-ab14529422) spec
          TARGET_CRC = 0xea759d7f
          TARGET_INIT = 0x170
          TARGET_CLEANUP = 0x3d8

          for ko in os.listdir('.'):
              if not ko.endswith('.ko'):
                  continue
              print(f"Checking & patching {ko}...")
              with open(ko, 'r+b') as f:
                  elf = ELFFile(f)
                  symtab = elf.get_section_by_name('.symtab')
                  versions = elf.get_section_by_name('__versions')
                  if not symtab or not versions:
                      print(f"Skipping {ko}: missing required ELF sections")
                      continue

                  # 1. Patch __versions section module_layout CRC
                  v_data = bytearray(versions.data())
                  pos = 0
                  while pos + 64 <= len(v_data):
                      crc, name_bytes = struct.unpack('<Q56s', v_data[pos:pos+64])
                      name = name_bytes.split(b'\x00')[0].decode('utf-8', errors='ignore')
                      if name == 'module_layout':
                          print(f"  [__versions] module_layout CRC: 0x{crc:08x} -> 0x{TARGET_CRC:08x}")
                          struct.pack_into('<Q', v_data, pos, TARGET_CRC)
                      pos += 64
                  f.seek(versions['sh_offset'])
                  f.write(v_data)

                  # 2. Patch .symtab CRC & offsets for init/cleanup
                  f.seek(symtab['sh_offset'])
                  s_data = bytearray(symtab.data())
                  for i in range(symtab.num_symbols()):
                      offset = i * 24
                      st_name, st_info, st_other, st_shndx, st_value, st_size = struct.unpack('<IBBHQQ', s_data[offset:offset+24])
                      sym_name = symtab.string_table.get_string(st_name)
                      if sym_name == '__crc_module_layout':
                          print(f"  [.symtab] __crc_module_layout: 0x{st_value:08x} -> 0x{TARGET_CRC:08x}")
                          struct.pack_into('<Q', s_data, offset + 8, TARGET_CRC)
                      elif sym_name == 'init_module' and st_value != TARGET_INIT:
                          print(f"  [.symtab] init_module: 0x{st_value:08x} -> 0x{TARGET_INIT:08x}")
                          struct.pack_into('<Q', s_data, offset + 8, TARGET_INIT)
                      elif sym_name == 'cleanup_module' and st_value != TARGET_CLEANUP:
                          print(f"  [.symtab] cleanup_module: 0x{st_value:08x} -> 0x{TARGET_CLEANUP:08x}")
                          struct.pack_into('<Q', s_data, offset + 8, TARGET_CLEANUP)
                  f.seek(symtab['sh_offset'])
                  f.write(s_data)
                  print(f"Successfully patched {ko} for Shennong!")

      - name: Package Final Drivers
        run: |
          cd "$GITHUB_WORKSPACE/output"
          echo "Packaging 4 patched drivers into flashable zip..."
          zip -9 airdrop-drivers-sm8650-safe.zip *.ko
          ls -lh airdrop-drivers-sm8650-safe.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-drivers-sm8650-safe
          path: ${{ github.workspace }}/output/airdrop-drivers-sm8650-safe.zip
          retention-days: 7
