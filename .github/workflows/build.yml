                        '#define RX_DATA_BUFFER_OPT_ALIGNMENT RX_DATA_BUFFER_ALIGNMENT\n#define QDF_BUFF_TYPE_RX 0\n'
                        'static inline QDF_STATUS dp_rx_page_pool_nbuf_alloc_and_map(struct dp_soc *soc, void *frag_info, uint8_t mac_id) { return QDF_STATUS_E_NOSUPPORT; }\n'
                        'static inline bool dp_rx_buffers_is_skip_replenish(struct dp_soc *soc, struct rx_desc_pool *pool, union dp_rx_desc_list_elem_t **desc_list, union dp_rx_desc_list_elem_t **tail, uint32_t *num, uint8_t mac_id) { return false; }\n'
                        'static inline bool dp_rx_buffers_is_critical_threshold(struct rx_desc_pool *pool) { return false; }\n'
                        'static inline void dp_rx_desc_dec_in_use_count(struct rx_desc_pool *pool, uint32_t req, uint32_t cnt) {}\n'
                        'static inline int8_t hal_rx_tlv_get_user_rssi(hal_soc_handle_t hal_soc, uint8_t *rx_tlv) { return 0; }\n'
                        'static inline bool dp_rx_intrabss_wds_ext_ap_bridge_check(struct dp_txrx_peer *ta_peer, struct dp_txrx_peer *da_peer, bool is_mcast) { return false; }\n'
                        'static inline void __dp_audio_smmu_map(struct dp_soc *soc, qdf_nbuf_t nbuf, uint32_t size) {}\n'
                        'static inline struct dp_peer *dp_peer_get_tgt_peer_by_vdev(struct dp_soc *soc, struct dp_vdev *vdev, enum dp_mod_id mod_id) { return NULL; }\n'
                        'static inline QDF_STATUS dp_rx_page_pool_alloc(struct dp_soc *soc, uint8_t mac_id, uint32_t num) { return QDF_STATUS_E_NOSUPPORT; }\n'
                        'static inline void dp_rx_page_pool_free(struct dp_soc *soc, uint8_t mac_id) {}\n'
                        'static inline uint32_t dp_get_num_entries(struct dp_pdev *pdev, uint32_t num, uint32_t type) { return num; }\n'
                        'static inline uint32_t dp_rx_get_num_buffers_required(struct rx_desc_pool *pool, uint32_t num) { return num; }\n#endif')
              if '_PATCH_DP_RX_STUBS' not in c else c
          ).replace('QDF_STATUS dp_rx_desc_nbuf_sanity_check(struct dp_soc *soc,\n\t\t\t\t\thal_ring_desc_t ring_desc,\n\t\t\t\t\tstruct dp_rx_desc *rx_desc)',
                    'static QDF_STATUS _unused_dp_rx_desc_nbuf_sanity_check(struct dp_soc *soc,\n\t\t\t\t\thal_ring_desc_t ring_desc,\n\t\t\t\t\tstruct dp_rx_desc *rx_desc)')
           .replace('dp_audio_smmu_map(dp_soc, (nbuf_frag_info_t->virt_addr).nbuf,\n\t\t\t  rx_desc_pool->buf_size);',
                    '__dp_audio_smmu_map(dp_soc, (nbuf_frag_info_t->virt_addr).nbuf,\n\t\t\t  rx_desc_pool->buf_size);')
           .replace('\t\t\t\t\t  true, __func__, __LINE__,\n\t\t\t\t\t  DP_RX_IPA_SMMU_MAP_REPLENISH);',
                    '\t\t\t\t\t  true, __func__, __LINE__);')
           .replace('\t\t\t\t\t\t__func__, __LINE__,\n\t\t\t\t\t\tDP_RX_IPA_SMMU_MAP_BUFF_ATTACH);',
                    '\t\t\t\t\t\t__func__, __LINE__);'))

          # B5: Weak fallback definitions so ZERO internal WLAN symbols are undefined at modpost/insmod time
          _pf('core/wma/src/wma_main.c', lambda c: c + (
              '\n#ifndef _PATCH_WMA_CONN_INFO_FALLBACK\n#define _PATCH_WMA_CONN_INFO_FALLBACK\n'
              '__attribute__((weak)) QDF_STATUS wma_get_connection_info(uint8_t vdev_id, struct policy_mgr_vdev_entry_info *conn_table_entry) { return QDF_STATUS_E_NOSUPPORT; }\n'
              '#endif\n'
          ) if '_PATCH_WMA_CONN_INFO_FALLBACK' not in c else c)

          _pf('components/cmn_services/policy_mgr/src/wlan_policy_mgr_get_set_utils.c', lambda c: c + (
              '\n#ifndef _PATCH_PM_WEAK_FALLBACKS\n#define _PATCH_PM_WEAK_FALLBACKS\n'
              '__attribute__((weak)) QDF_STATUS policy_mgr_get_connection_table_entry_info(struct wlan_objmgr_pdev *pdev, uint8_t vdev_id, struct policy_mgr_vdev_entry_info *conn_table_entry) { return QDF_STATUS_E_NOSUPPORT; }\n'
              '__attribute__((weak)) bool policy_mgr_if_freq_n_inactive_links_freq_same(struct wlan_objmgr_psoc *psoc, uint32_t freq) { return false; }\n'
              '#endif\n'
          ) if '_PATCH_PM_WEAK_FALLBACKS' not in c else c)

          _pf(os.path.join(_cmn, 'dp/wifi3.0/monitor/dp_mon.c'), lambda c: c + (
              '\n#ifndef _PATCH_DP_MON_2_0_WEAK_FALLBACKS\n#define _PATCH_DP_MON_2_0_WEAK_FALLBACKS\n'
              '__attribute__((weak)) QDF_STATUS dp_mon_pdev_htt_srng_setup_2_0(struct dp_soc *soc, struct dp_pdev *pdev, int mac_id, int mac_for_pdev) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) QDF_STATUS dp_mon_soc_htt_srng_setup_2_0(struct dp_soc *soc) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) QDF_STATUS dp_mon_soc_attach_2_0(struct dp_soc *soc) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) QDF_STATUS dp_mon_soc_init_2_0(struct dp_soc *soc) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) void dp_mon_soc_deinit_2_0(struct dp_soc *soc) {}\n'
              '__attribute__((weak)) QDF_STATUS dp_mon_soc_detach_2_0(struct dp_soc *soc) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) void dp_pdev_mon_rings_deinit_2_0(struct dp_pdev *pdev) {}\n'
              '__attribute__((weak)) QDF_STATUS dp_pdev_mon_rings_init_2_0(struct dp_pdev *pdev) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) void dp_pdev_mon_rings_free_2_0(struct dp_pdev *pdev) {}\n'
              '__attribute__((weak)) QDF_STATUS dp_pdev_mon_rings_alloc_2_0(struct dp_pdev *pdev) { return QDF_STATUS_SUCCESS; }\n'
              '#ifdef WLAN_FEATURE_LOCAL_PKT_CAPTURE\n'
              '__attribute__((weak)) QDF_STATUS dp_local_pkt_capture_tx_config(struct dp_pdev *pdev) { return QDF_STATUS_SUCCESS; }\n'
              '#endif\n'
              '__attribute__((weak)) QDF_STATUS dp_tx_mon_filter_update_2_0(struct dp_pdev *pdev) { return QDF_STATUS_SUCCESS; }\n'
              '__attribute__((weak)) void dp_mon_filter_setup_local_pkt_capture_tx(struct dp_pdev *pdev) {}\n'
              '__attribute__((weak)) void dp_mon_filter_reset_local_pkt_capture_tx(struct dp_pdev *pdev) {}\n'
              '__attribute__((weak)) void dp_mon_register_lpc_ops_1_0(struct dp_mon_ops *mon_ops) {}\n'
              '#endif\n'
          ) if '_PATCH_DP_MON_2_0_WEAK_FALLBACKS' not in c else c)

          # B6: Disable IPA hardware offload & OPlus Local Packet Capture in pineapple_gki_kiwi-v2_defconfig
          #     -> Eliminates IPA struct/KCFI/DMA panic risks & eliminates all 5 undefined LPC/monitor symbols,
          #        matching stock Shennong hdd_wiphy_vendor_commands (6216 bytes) to the exact byte!
          _pf('configs/pineapple_gki_kiwi-v2_defconfig', lambda c: (
              c.replace('CONFIG_IPA_OFFLOAD=y', '# CONFIG_IPA_OFFLOAD is not set')
               .replace('CONFIG_IPA_SET_RESET_TX_DB_PA=y', '# CONFIG_IPA_SET_RESET_TX_DB_PA is not set')
               .replace('CONFIG_WDI3_IPA_OVER_GSI=y', '# CONFIG_WDI3_IPA_OVER_GSI is not set')
               .replace('CONFIG_WLAN_DP_LOCAL_PKT_CAPTURE=y', '# CONFIG_WLAN_DP_LOCAL_PKT_CAPTURE is not set')
          ))

          print("ALL SOURCE PATCHES APPLIED CLEANLY AND SAFELY!")

      - name: Compile AWDL Kernel Modules (including qca_cld3_kiwi_v2.ko)
        run: |
          export ARCH=arm64
          export LLVM=1
          export CROSS_COMPILE=aarch64-linux-gnu-
          export KERNEL_SRC="$GITHUB_WORKSPACE/ack-6.1"
          export WERROR=0
          export LOCALVERSION=""

          mkdir -p "$GITHUB_WORKSPACE/output"

          # 1. Compile wonder provider & probe FIRST (exports cnss_set_vendor_wonder_priv_data CRC)
          if [ -d "$GITHUB_WORKSPACE/wlan/provider" ]; then
            cd "$GITHUB_WORKSPACE/wlan/provider"
            echo "obj-m += opairshare_wonder_provider.o" > Kbuild
            echo "opairshare_wonder_provider-y := provider.o" >> Kbuild
            echo "obj-m += opairshare_route_b_probe.o" >> Kbuild
            echo "opairshare_route_b_probe-y := probe.o" >> Kbuild
            make -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 LOCALVERSION="" WERROR=0 \
              KCFLAGS="-w -I$GITHUB_WORKSPACE/wlan/wonder/include -I$GITHUB_WORKSPACE/wlan/wonder" \
              KBUILD_MODPOST_WARN=1 modules
            [ -f opairshare_wonder_provider.ko ] || { echo "ERROR: opairshare_wonder_provider.ko was not built!"; exit 1; }
            [ -f opairshare_route_b_probe.ko ] || { echo "ERROR: opairshare_route_b_probe.ko was not built!"; exit 1; }
            cp opairshare_wonder_provider.ko "$GITHUB_WORKSPACE/output/"
            cp opairshare_route_b_probe.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 2. Compile wonder.ko
          if [ -d "$GITHUB_WORKSPACE/wlan/wonder" ]; then
            cd "$GITHUB_WORKSPACE/wlan/wonder"
            echo 'KCFLAGS += -I$(src)/include -I$(src)' > Makefile.include
            make -j$(nproc) -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 LOCALVERSION="" WERROR=0 \
              KCFLAGS="-w -DCONFIG_WONDER_SUPPORT=1 -DCONFIG_WONDER_RX_FILTER_SUPPORT=1 -DCONFIG_WONDER_SYNA_SUPPORT=1 -I$PWD/include -I$PWD" \
              KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/wlan/provider/Module.symvers" \
              KBUILD_MODPOST_WARN=1 modules
            [ -f wonder.ko ] || { echo "ERROR: wonder.ko was not built!"; exit 1; }
            cp wonder.ko "$GITHUB_WORKSPACE/output/"
          fi

          # 3. Compile patched qca_cld3_kiwi_v2.ko (PASSTHRU / AWDL enabled, IPA offload disabled cleanly)
          if [ -d "$GITHUB_WORKSPACE/wlan/qcacld-3.0" ]; then
            cd "$GITHUB_WORKSPACE/wlan/qcacld-3.0"
            ln -sfn "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" cmn

            # Directory symlinks for fw-api to satisfy api/fw/wmi.h includes
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/wma/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/inc/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" core/hdd/api
            ln -sfn "$GITHUB_WORKSPACE/wlan/fw-api" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/api"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" "$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn/soc"
            ln -sfn "$GITHUB_WORKSPACE/wlan/soc" soc

            set -o pipefail
            make -j$(nproc) -C "$KERNEL_SRC" M="$PWD" \
              ARCH=arm64 LLVM=1 LOCALVERSION="" WERROR=0 \
              MODNAME=qca_cld3_kiwi_v2 \
              CONFIG_QCA_CLD_WLAN=m \
              CONFIG_QCA_CLD_WLAN_PROFILE=pineapple_gki_kiwi-v2 \
              CONFIG_QCA_WIFI_ISOC=0 \
              CONFIG_QCA_WIFI_2_0=1 \
              WLAN_ROOT="$PWD" \
              WLAN_COMMON_ROOT=cmn \
              WLAN_COMMON_INC="$GITHUB_WORKSPACE/wlan/qca-wifi-host-cmn" \
              WLAN_FW_API="$GITHUB_WORKSPACE/wlan/fw-api" \
              WLAN_PLATFORM_INC="$GITHUB_WORKSPACE/wlan/platform/inc" \
              DATA_IPA_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include" \
              DATA_IPA_UAPI_INC="$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KCFLAGS="-w -DDRIVER_PASSTHRU_MODE -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              EXTRA_CFLAGS="-w -DDRIVER_PASSTHRU_MODE -D__ANDROID_COMMON_KERNEL__ -DCFG80211_RU_PUNCT_NOTIFY -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT -I$GITHUB_WORKSPACE/wlan/wonder/include -I$PWD/core/wma/src -I$PWD/core/hdd/src -I$PWD/core/hdd/inc -I$GITHUB_WORKSPACE/wlan/provider -I$GITHUB_WORKSPACE/wlan -I$GITHUB_WORKSPACE/wlan/fw-api -I$GITHUB_WORKSPACE/wlan/qcacld-3.0 -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include -I$GITHUB_WORKSPACE/dataipa/drivers/platform/msm/include/uapi" \
              KBUILD_EXTRA_SYMBOLS="$GITHUB_WORKSPACE/wlan/provider/Module.symvers" \
              KBUILD_MODPOST_WARN=1 modules 2>&1 | tee /tmp/qca_build.log || {
                echo "=== FIRST COMPILE ERRORS ==="
                grep -m 25 -B 1 -A 2 "fatal error:\|error:" /tmp/qca_build.log || tail -n 50 /tmp/qca_build.log
                exit 1
              }
            [ -f qca_cld3_kiwi_v2.ko ] || { echo "ERROR: qca_cld3_kiwi_v2.ko was not built!"; exit 1; }
            cp qca_cld3_kiwi_v2.ko "$GITHUB_WORKSPACE/output/"
          fi

          echo "=== Stripping DWARF debug sections (preserving .symtab, KCFI, relocations & __versions) ==="
          llvm-strip --strip-debug "$GITHUB_WORKSPACE/output"/*.ko
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Verify 100% Panic-Safe Shennong Binary ABI Gate
        shell: python
        working-directory: ${{ github.workspace }}/output
        run: |
          import os, struct
          from elftools.elf.elffile import ELFFile

          EXPECTED_VERMAGIC = "6.1.138-android14-11-g0c3d559bcd85-ab14529422 SMP preempt mod_unload modversions aarch64"
          EXPECTED_TM_SIZE = 0x440
          EXPECTED_INIT_OFF = 0x170
          EXPECTED_EXIT_OFF = 0x3d8
          EXPECTED_LAYOUT_CRC = 0xea759d7f
          EXPECTED_INIT_KCFI = 0x36b1c5a6

          REQUIRED_FILES = [
              'opairshare_wonder_provider.ko',
              'opairshare_route_b_probe.ko',
              'wonder.ko',
              'qca_cld3_kiwi_v2.ko',
          ]

          for fn in REQUIRED_FILES:
              assert os.path.exists(fn), f"Missing built module: {fn}"
              sz_mb = os.path.getsize(fn) / (1024 * 1024)
              assert sz_mb < 35.0, f"{fn} is unstripped / too large ({sz_mb:.1f} MB)!"

              with open(fn, 'rb') as f:
                  elf = ELFFile(f)

                  # 1. Check vermagic
                  mi = elf.get_section_by_name('.modinfo')
                  assert mi is not None, f"{fn}: missing .modinfo"
                  vm_list = [x.decode('latin1', errors='ignore').split('=', 1)[1]
                             for x in mi.data().split(b'\x00') if x.startswith(b'vermagic=')]
                  assert vm_list == [EXPECTED_VERMAGIC], f"{fn}: vermagic mismatch: {vm_list}"

                  # 2. Check .gnu.linkonce.this_module size (0x440) and init/exit offsets (0x170 / 0x3d8)
                  tm = elf.get_section_by_name('.gnu.linkonce.this_module')
                  assert tm is not None and tm['sh_size'] == EXPECTED_TM_SIZE, (
                      f"{fn}: this_module size={hex(tm['sh_size']) if tm else None}, expected {hex(EXPECTED_TM_SIZE)}"
                  )
                  rs = elf.get_section_by_name('.rela.gnu.linkonce.this_module')
                  st = elf.get_section_by_name('.symtab')
                  assert rs is not None and st is not None, f"{fn}: missing this_module relas or symtab"
                  relmap = {st.get_symbol(r['r_info_sym']).name: r['r_offset'] for r in rs.iter_relocations()}
                  assert relmap.get('init_module') == EXPECTED_INIT_OFF, f"{fn}: init_module offset={relmap.get('init_module')}"
                  if 'cleanup_module' in relmap:
                      assert relmap.get('cleanup_module') == EXPECTED_EXIT_OFF, f"{fn}: cleanup_module offset={relmap.get('cleanup_module')}"

                  # 3. Check KCFI preamble word right before init_module (-4 bytes)
                  init_sym = [s for s in st.iter_symbols() if s.name == 'init_module'][0]
                  init_sec = elf.get_section(init_sym['st_shndx'])
                  init_off = init_sym['st_value']
                  assert init_off >= 4, f"{fn}: init_module missing 4-byte KCFI preamble!"
                  kcfi_word = struct.unpack_from('<I', init_sec.data(), init_off - 4)[0]
                  assert kcfi_word == EXPECTED_INIT_KCFI, f"{fn}: init_module KCFI mismatch: {hex(kcfi_word)}"

                  # 4. Check __versions completeness & module_layout CRC
                  vsec = elf.get_section_by_name('__versions')
                  assert vsec is not None and vsec['sh_size'] >= 64, f"{fn}: empty/missing __versions!"
                  vd = vsec.data()
                  vers = {}
                  for o in range(0, len(vd), 64):
                      crc = struct.unpack_from('<Q', vd, o)[0] & 0xffffffff
                      nm = vd[o+8:o+64].split(b'\x00', 1)[0].decode('latin1', errors='ignore')
                      if nm:
                          vers[nm] = crc
                  assert vers.get('module_layout') == EXPECTED_LAYOUT_CRC, (
                      f"{fn}: module_layout CRC={hex(vers.get('module_layout', 0))}, expected {hex(EXPECTED_LAYOUT_CRC)}"
                  )

                  undefs = sorted(set(s.name for s in st.iter_symbols() if s.name and s['st_shndx'] == 'SHN_UNDEF'))
                  missing_crc = [u for u in undefs if u[:55] not in vers or vers[u[:55]] == 0]
                  assert not missing_crc, f"{fn}: symbols missing Modversions CRC: {missing_crc}"

                  # 5. Module-specific struct ABI checks (using set per name to avoid local symbol collisions)
                  from collections import defaultdict
                  obj_sizes = defaultdict(set)
                  for s in st.iter_symbols():
                      if s.name and s['st_info']['type'] == 'STT_OBJECT' and s['st_size'] > 0:
                          obj_sizes[s.name].add(s['st_size'])
                  if fn == 'wonder.ko':
                      assert 960 in obj_sizes['wonder_mac80211_ops'], (
                          f"wonder_mac80211_ops sizes={obj_sizes['wonder_mac80211_ops']}, expected 960!"
                      )
                  elif fn == 'qca_cld3_kiwi_v2.ko':
                      assert 1008 in obj_sizes['wlan_hdd_cfg80211_ops'], f"cfg80211_ops={obj_sizes['wlan_hdd_cfg80211_ops']}"
                      assert 6216 in obj_sizes['hdd_wiphy_vendor_commands'], f"vendor_cmds={obj_sizes['hdd_wiphy_vendor_commands']}"
                      assert 672 in obj_sizes['net_ops_struct'], f"net_ops_struct={obj_sizes['net_ops_struct']}"
                      assert 144 in obj_sizes['wlan_drv_ops'], f"wlan_drv_ops={obj_sizes['wlan_drv_ops']}"
                      assert 168 in obj_sizes['pld_pcie_ops'], f"pld_pcie_ops={obj_sizes['pld_pcie_ops']}"
                      bad_syms = [u for u in undefs if u.startswith('ipa_') or 'lpc' in u or u == 'set_monitor_mode_policy']
                      assert not bad_syms, f"Forbidden IPA/LPC symbols in qca_cld3_kiwi_v2.ko: {bad_syms}"

                  print(f"[PASS] {fn:32s} | size={sz_mb:5.2f}MB | this_module=0x440 | KCFI=0x36b1c5a6 | CRCs={len(vers)} (100% covered)")

          print("ALL 4 KERNEL MODULES PASSED EVERY SHENNONG BINARY SAFETY GATE!")

      - name: Package Final Drivers
        run: |
          cd "$GITHUB_WORKSPACE/output"
          zip -9 airdrop-drivers-sm8650-safe.zip *.ko
          ls -la

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: airdrop-drivers-sm8650-safe
          path: ${{ github.workspace }}/output/airdrop-drivers-sm8650-safe.zip
